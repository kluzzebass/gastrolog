name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache-dependency-path: backend/go.sum

      - name: Build
        run: go build -v ./...

      # Fast tier only. ubuntu-latest is a 2-core shared runner; the
      # reliability/soak family (multi-node sustained-ingest, restart
      # convergence, election timing) needs real hardware and starves here —
      # they gate themselves behind testing.Short() (gastrolog-3241bv). This
      # runs everything else. The full tier is the developer's pre-handoff
      # gate (`just backend test-full`) and would need a self-hosted/beefy
      # runner to automate; do NOT drop -short here to "run everything" — it
      # only produces false reds.
      - name: Test (fast tier)
        run: go test -short -v ./...
