syntax = "proto3";

package gastrolog.v1;

import "google/protobuf/timestamp.proto";
import "gastrolog/v1/cluster.proto";
import "gastrolog/v1/system.proto";
import "gastrolog/v1/vault.proto";

option go_package = "gastrolog/api/gen/gastrolog/v1;gastrologv1";

// LifecycleService provides server lifecycle management.
service LifecycleService {
  // Health returns the server health status.
  rpc Health(HealthRequest) returns (HealthResponse);

  // Shutdown initiates a graceful shutdown.
  rpc Shutdown(ShutdownRequest) returns (ShutdownResponse);

  // GetClusterStatus returns the current cluster topology and Raft state.
  rpc GetClusterStatus(GetClusterStatusRequest) returns (GetClusterStatusResponse);

  // SetNodeSuffrage promotes or demotes a node's voting status.
  rpc SetNodeSuffrage(SetNodeSuffrageRequest) returns (SetNodeSuffrageResponse);

  // SetNodeState transitions a node between lifecycle states (Live,
  // Maintenance, Draining, etc.). Idempotent — re-applying the same
  // state is a no-op success. Illegal transitions return
  // FailedPrecondition with the FSM's transition-validation error.
  // See docs/node-lifecycle-design.md.
  rpc SetNodeState(SetNodeStateRequest) returns (SetNodeStateResponse);

  // JoinCluster joins a running single-node server to an existing cluster at runtime.
  // The node's Raft state is replaced by the remote cluster's state via replication.
  rpc JoinCluster(JoinClusterRequest) returns (JoinClusterResponse);

  // RemoveNode evicts a node from the cluster. Must be called on the leader.
  // The evicted node receives a best-effort shutdown notification.
  rpc RemoveNode(RemoveNodeRequest) returns (RemoveNodeResponse);

  // YieldLeadership asks this node to transfer Raft leadership to another
  // voter, if it currently holds leadership. Non-leaders no-op. Intended
  // as a Kubernetes preStop hook so a pod that's about to be terminated
  // hands off leadership cleanly without disturbing cluster membership.
  // See gastrolog-2yeie.
  rpc YieldLeadership(YieldLeadershipRequest) returns (YieldLeadershipResponse);

  // WatchSystemStatus streams combined system status (cluster, health, route
  // stats) whenever stats are updated. Replaces polling GetClusterStatus,
  // Health, and GetRouteStats.
  rpc WatchSystemStatus(WatchSystemStatusRequest) returns (stream WatchSystemStatusResponse);

  // AckAlarm acknowledges a standing alarm by ID, recording operator
  // awareness (who + when). Servable from ANY node: the serving node
  // resolves every raiser of the ID (local collector + peer broadcasts)
  // and fans the ack out to each, so a cluster-wide condition raised by
  // multiple nodes cannot reappear unacked on the next aggregation.
  // Latching alarms whose condition has resolved clear on ack.
  rpc AckAlarm(AckAlarmRequest) returns (AckAlarmResponse);

  // ShelveAlarm suppresses a standing alarm for a duration. The expiry is
  // MANDATORY — a missing, zero or negative duration is rejected — and
  // unshelveable types (software faults, alarm-flood) are rejected with
  // the reason. Same any-node fan-out semantics as AckAlarm.
  rpc ShelveAlarm(ShelveAlarmRequest) returns (ShelveAlarmResponse);

  // UnshelveAlarm ends a shelve early, returning the alarm to its live
  // state. Same any-node fan-out semantics as AckAlarm.
  rpc UnshelveAlarm(UnshelveAlarmRequest) returns (UnshelveAlarmResponse);
}

message HealthRequest {}

message HealthResponse {
  Status status = 1;
  string version = 2;
  int64 uptime_seconds = 3;
  int64 ingest_queue_depth = 4;
  int64 ingest_queue_capacity = 5;
}

enum Status {
  STATUS_UNSPECIFIED = 0;
  STATUS_HEALTHY = 1;
  STATUS_DEGRADED = 2;
  STATUS_UNHEALTHY = 3;
}

message ShutdownRequest {
  bool drain = 1; // If true, wait for in-flight requests to complete
}

message ShutdownResponse {}

message GetClusterStatusRequest {}

message GetClusterStatusResponse {
  bool cluster_enabled = 1;
  bytes leader_id = 2;
  string leader_address = 3;
  repeated ClusterNode nodes = 4;
  RaftStats local_stats = 5;
  bytes local_node_id = 6;
  string join_token = 7;
  string cluster_address = 8;
}

// RaftStats contains Raft consensus statistics for the local node.
// These are derived from the Hashicorp Raft Stats() call and typed methods.
message RaftStats {
  string state = 1;              // "Leader", "Follower", "Candidate", "Shutdown"
  uint64 term = 2;
  uint64 last_log_index = 3;
  uint64 last_log_term = 4;
  uint64 commit_index = 5;
  uint64 applied_index = 6;
  uint64 fsm_pending = 7;
  uint64 last_snapshot_index = 8;
  uint64 last_snapshot_term = 9;
  string last_contact = 10;      // duration since last leader contact (e.g. "12ms", "never")
  uint32 num_peers = 11;
  uint32 protocol_version = 12;
}

message ClusterNode {
  bytes id = 1;
  string name = 2;
  string address = 3;            // cluster/Raft address (e.g. ":4566")
  ClusterNodeRole role = 4;
  ClusterNodeSuffrage suffrage = 5;
  bool is_leader = 6;
  NodeStats stats = 7;
  string api_address = 8;        // HTTP API address (e.g. ":4564")
  string pprof_address = 9;      // pprof HTTP address (e.g. "localhost:6060"), empty if disabled
  // Lifecycle state from NodeConfig. NODE_STATE_UNSPECIFIED is treated
  // as LIVE by the UI for back-compat with legacy records minted before
  // the State field existed.
  NodeState state = 10;
  // Wall-clock instant the current state was entered. Zero if the
  // node has never had State explicitly set.
  google.protobuf.Timestamp state_since = 11;
}

enum ClusterNodeRole {
  CLUSTER_NODE_ROLE_UNSPECIFIED = 0;
  CLUSTER_NODE_ROLE_LEADER = 1;
  CLUSTER_NODE_ROLE_FOLLOWER = 2;
}

enum ClusterNodeSuffrage {
  CLUSTER_NODE_SUFFRAGE_UNSPECIFIED = 0;
  CLUSTER_NODE_SUFFRAGE_VOTER = 1;
  CLUSTER_NODE_SUFFRAGE_NONVOTER = 2;
  CLUSTER_NODE_SUFFRAGE_STAGING = 3;
}

message SetNodeSuffrageRequest {
  bytes node_id = 1;
  bool voter = 2; // true = promote to voter, false = demote to nonvoter
}

message SetNodeSuffrageResponse {}

message SetNodeStateRequest {
  bytes node_id = 1;
  NodeState state = 2;
}

message SetNodeStateResponse {}

message JoinClusterRequest {
  string leader_address = 1; // cluster address of the leader to join (e.g., "10.0.0.1:4566")
  string join_token = 2;     // join token from the leader's cluster status
}

message JoinClusterResponse {}

message RemoveNodeRequest {
  bytes node_id = 1; // ID of the node to evict from the cluster
  // allow_self lets the caller remove the node the RPC is served by.
  // Default false because operator-driven removal almost always targets
  // a different node, and accidentally removing the node you're
  // currently connected to is hazardous. Set to true ONLY by the
  // `gastrolog cluster demote-self` preStop hook path (gastrolog-24iv4)
  // where self-removal is the intent.
  bool allow_self = 2;
  // force bypasses the orphan-refusal gate: when true, removal proceeds
  // even if it would leave a vault with zero placements (data loss).
  // Default false — the gate refuses removal of the sole holder of any
  // vault. Operators set this only with explicit data-loss
  // acknowledgement. See gastrolog-2ch9y.
  bool force = 3;
}

message RemoveNodeResponse {}

message YieldLeadershipRequest {}

message YieldLeadershipResponse {
  // True if this node was the cluster leader at call time and the
  // transfer was initiated. False if the call was a no-op because the
  // node wasn't leader.
  bool transferred = 1;
}

message AckAlarmRequest {
  // Full alarm ID ("<type>" or "<type>:<instance>"), as carried in
  // SystemAlert.id.
  bytes alarm_id = 1;
  // Operator identity to record. The server prefers the authenticated
  // user's name when the request carries one; this field covers the local
  // Unix-socket CLI path, which has no auth context.
  string acked_by = 2;
  // Internal: apply to this node's collector only — set on the fan-out leg
  // so a forwarded ack never re-fans. Client requests leave this unset.
  bool local_only = 3;
}

message AckAlarmResponse {
  // Number of raiser nodes the ack applied on.
  uint32 applied = 1;
}

message ShelveAlarmRequest {
  bytes alarm_id = 1;
  // Shelve duration in seconds. MANDATORY and positive: shelves always
  // expire — there are no permanent shelves.
  int64 duration_seconds = 2;
  // Operator identity to record in the lifecycle journal (same sourcing
  // rules as AckAlarmRequest.acked_by).
  string shelved_by = 3;
  // Internal fan-out leg marker; see AckAlarmRequest.local_only.
  bool local_only = 4;
}

message ShelveAlarmResponse {
  uint32 applied = 1;
  // Expiry instant computed by the first collector the shelve applied on.
  google.protobuf.Timestamp shelved_until = 2;
}

message UnshelveAlarmRequest {
  bytes alarm_id = 1;
  // Internal fan-out leg marker; see AckAlarmRequest.local_only.
  bool local_only = 2;
}

message UnshelveAlarmResponse {
  uint32 applied = 1;
}

message WatchSystemStatusRequest {}

message WatchSystemStatusResponse {
  GetClusterStatusResponse cluster = 1;
  HealthResponse health = 2;
  GetRouteStatsResponse route_stats = 3;
  repeated VaultInfo vaults = 4;
  GetStatsResponse stats = 5;
  // Per-ingester runtime alive map, replicated from the FSM. Sent on every
  // stats tick so the inspector's per-card "running/selected" badge can
  // derive node_status without a separate ListIngesters round-trip.
  repeated IngesterAlive ingester_alive = 6;
  // Per-vault chunking pipeline depth (vault-ctl FSM + aggregated segment
  // disk counts from NodeStats broadcasts). Push-updated on each stats tick.
  repeated VaultPipelineBacklog pipeline_backlog = 7;
}
