syntax = "proto3";

package gastrolog.v1;

import "google/protobuf/descriptor.proto";

option go_package = "gastrolog/api/gen/gastrolog/v1;gastrologv1";

// AuthLevel is the authorization a caller must satisfy to invoke an RPC.
enum AuthLevel {
  // No level declared. The interceptor denies the procedure: authorization is
  // part of a method's contract, so an RPC that does not state one is not
  // reachable.
  AUTH_LEVEL_UNSPECIFIED = 0;

  // Reachable without a token. Claims are still parsed when a token is
  // present, so a handler can return more to a known caller.
  AUTH_LEVEL_PUBLIC = 1;

  // Requires a valid, unrevoked token of any role.
  AUTH_LEVEL_AUTHENTICATED = 2;

  // Requires a valid, unrevoked token whose role is admin.
  AUTH_LEVEL_ADMIN = 3;
}

extend google.protobuf.MethodOptions {
  // Every RPC served over Connect declares one. Field 50000 is the first of
  // the 50000-99999 range protobuf reserves for extensions private to a single
  // organization: numbers there are never handed out to a published extension,
  // so this cannot collide with an option carried by an imported schema.
  AuthLevel auth_level = 50000;
}
