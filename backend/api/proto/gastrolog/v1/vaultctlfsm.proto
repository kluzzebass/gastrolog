syntax = "proto3";

package gastrolog.v1;

import "gastrolog/v1/vault.proto";

option go_package = "gastrolog/api/gen/gastrolog/v1;gastrologv1";

// Wire types for the vault-control-plane Raft FSM (backend/internal/vaultraft
// and backend/internal/vaultraft/vaultctlfsm). These replace the hand-rolled
// binary command + snapshot encodings. See gastrolog-5lrg7.
//
// Encoding notes that the Go layer relies on:
//   - 16-byte GLIDs (chunk IDs, vault IDs, cloud service IDs) are `bytes`.
//   - The 32-byte GLCB whole-blob digest is `bytes`.
//   - Timestamps are Unix nanoseconds as int64 (time.Time.UnixNano()), which
//     round-trips the zero time exactly; google.protobuf.Timestamp is
//     deliberately NOT used because the FSM persists raw nanos including the
//     sentinel zero-time value.

// ---------- Outer envelope (replaces vaultraft/cmd.go opcode byte) ----------

// VaultRaftCommand is the top-level Raft log payload for the vault-ctl group.
// Replaces the leading opcode byte (OpNoop / OpVaultChunkFSM).
message VaultRaftCommand {
  oneof command {
    NoopCommand noop = 1;
    VaultScopedCommand vault_scoped = 2;
  }
}

// NoopCommand is a replicated no-op for tests and liveness checks (OpNoop).
message NoopCommand {}

// VaultScopedCommand wraps a vaultctlfsm command scoped to one vault-instance
// GLID (OpVaultChunkFSM).
message VaultScopedCommand {
  bytes vault_id = 1;
  VaultCtlCommand command = 2;
}

// ---------- Inner command (replaces vaultctlfsm Command opcodes 1-13) -------

// VaultCtlCommand is one chunk-metadata mutation applied to a single vault's
// manifest FSM. Field numbers match the legacy Command opcodes 1-13.
message VaultCtlCommand {
  oneof command {
    CreateChunkCommand create_chunk = 1;
    SealChunkCommand seal_chunk = 2;
    UploadChunkCommand upload_chunk = 3;
    // delete_chunk (4) is retained for WAL replay only; no current producer
    // emits it (see CmdDeleteChunk in fsm.go).
    DeleteChunkCommand delete_chunk = 4;
    RetentionPendingCommand retention_pending = 5;
    RequestDeleteCommand request_delete = 6;
    AckDeleteCommand ack_delete = 7;
    FinalizeDeleteCommand finalize_delete = 8;
    PruneNodeCommand prune_node = 9;
    AttachOffsetsCommand attach_offsets = 10;
    BeginSealCommand begin_seal = 11;
    RepatriateChunkCommand repatriate_chunk = 12;
    PublishCompletedSegmentCommand publish_completed_segment = 13;
    OpenChunkManifestCommand open_chunk_manifest = 14;
    AddOpenChunkSegmentRefCommand add_open_chunk_segment_ref = 15;
    SealOpenChunkManifestCommand seal_open_chunk_manifest = 16;
    ReleaseSegmentsCommand release_segments = 17;
    AckSegmentHolderCommand ack_segment_holder = 18;
    DiscardOpenChunkManifestCommand discard_open_chunk_manifest = 19;
    PublishCompletedSegmentsCommand publish_completed_segments = 20;
    AddOpenChunkSegmentRefsCommand add_open_chunk_segment_refs = 21;
    AckChunkHolderCommand ack_chunk_holder = 22;
    RevokeChunkHolderCommand revoke_chunk_holder = 23;
  }
}

message CreateChunkCommand {
  bytes id = 1;
  int64 write_start_nanos = 2;
  int64 ingest_start_nanos = 3;
  int64 source_start_nanos = 4;
}

message SealChunkCommand {
  bytes id = 1;
  int64 write_end_nanos = 2;
  int64 record_count = 3;
  int64 bytes = 4;
  int64 ingest_end_nanos = 5;
  int64 source_end_nanos = 6;
  int64 ingest_start_nanos = 7;
  bool ingest_ts_monotonic = 8;
  // Wall-clock sealing completion (leader-chosen, replicated). Retention
  // MaxAge measures age from this timestamp, not WriteEnd.
  int64 sealed_at_nanos = 9;
}

message UploadChunkCommand {
  bytes id = 1;
  int64 disk_bytes = 2;
  int64 ingest_idx_offset = 3;
  int64 ingest_idx_size = 4;
  int64 source_idx_offset = 5;
  int64 source_idx_size = 6;
  // Integrity fields (gastrolog-grnc3); optional, present on the extended form.
  bytes hash = 7;
  bytes cloud_service_id = 8;
  uint32 key_scheme = 9;
}

message DeleteChunkCommand {
  bytes id = 1;
}

message RetentionPendingCommand {
  bytes id = 1;
}

message RequestDeleteCommand {
  bytes id = 1;
  int64 proposed_at_nanos = 2;
  string reason = 3;
  repeated string expected_from = 4;
}

message AckDeleteCommand {
  bytes id = 1;
  string node_id = 2;
}

message FinalizeDeleteCommand {
  bytes id = 1;
}

message PruneNodeCommand {
  string node_id = 1;
}

message AttachOffsetsCommand {
  bytes id = 1;
  int64 ingest_idx_offset = 2;
  int64 ingest_idx_size = 3;
  int64 source_idx_offset = 4;
  int64 source_idx_size = 5;
}

message BeginSealCommand {
  bytes id = 1;
}

// RepatriateChunkCommand carries a full manifest entry to re-introduce a
// sealed chunk's metadata. Apply forces state to SEALED. See gastrolog-32bf2.
message RepatriateChunkCommand {
  ManifestEntry entry = 1;
}

// PublishCompletedSegmentCommand registers a completed segment in the vault-ctl
// FSM. Origin publishes when Segmentation closes a segment.
message PublishCompletedSegmentCommand {
  bytes segment_id = 1;
  uint32 record_count = 2;
  uint64 byte_size = 3;
  int64 first_ingest_ts_nanos = 4;
  int64 last_ingest_ts_nanos = 5;
  uint32 checksum = 6;
  // Node that completed the segment (holder hint for Collection).
  string origin_node_id = 7;
  // Wall time carried in the command for deterministic replay (Unix nanos).
  int64 published_at_nanos = 8;
}

// PublishCompletedSegmentsCommand registers many completed segments in one
// vault-ctl apply so origin nodes amortize a single Raft round-trip under burst
// ingest.
message PublishCompletedSegmentsCommand {
  repeated PublishCompletedSegmentCommand segments = 1;
}

// CompletedSegmentEntry is replicated registry state for one completed segment.
message CompletedSegmentEntry {
  bytes segment_id = 1;
  uint32 record_count = 2;
  uint64 byte_size = 3;
  int64 first_ingest_ts_nanos = 4;
  int64 last_ingest_ts_nanos = 5;
  uint32 checksum = 6;
  string origin_node_id = 7;
  int64 published_at_nanos = 8;
  // Node IDs that have pulled, verified, and committed a holder receipt for
  // this segment (Rubicon C). Grows toward the vault home set.
  repeated string holders = 9;
}

// OpenChunkSegmentRef names a partial or whole slice of one segment in the
// open-chunk manifest (EventID-sorted record numbers, inclusive last).
message OpenChunkSegmentRef {
  bytes segment_id = 1;
  uint32 first_record_number = 2;
  uint32 last_record_number = 3;
  uint64 slice_bytes = 4;
  int64 ref_added_at_nanos = 5;
}

// OpenChunkManifestState is the replicated open or sealed manifest awaiting build.
message OpenChunkManifestState {
  bytes chunk_id = 1;
  int64 opened_at_nanos = 2;
  repeated OpenChunkSegmentRef refs = 3;
  uint64 total_records = 4;
  uint64 total_bytes = 5;
  int64 sealed_at_nanos = 6;
  // Running min/max record timestamps across all refs (inspector / query bounds).
  int64 write_start_nanos = 7;
  int64 write_end_nanos = 8;
  int64 ingest_start_nanos = 9;
  int64 ingest_end_nanos = 10;
  int64 source_start_nanos = 11;
  int64 source_end_nanos = 12;
}

// SegmentResumeRecordNumber is the next EventID-order record number to chunk
// from a segment after partial inclusion.
message SegmentResumeRecordNumber {
  bytes segment_id = 1;
  uint32 next_record_number = 2;
}

// OpenChunkManifestCommand opens a new manifest-backed active chunk.
message OpenChunkManifestCommand {
  bytes chunk_id = 1;
  int64 opened_at_nanos = 2;
}

// AddOpenChunkSegmentRefCommand appends one segment slice to the open manifest.
message AddOpenChunkSegmentRefCommand {
  bytes chunk_id = 1;
  bytes segment_id = 2;
  uint32 first_record_number = 3;
  uint32 last_record_number = 4;
  uint64 slice_bytes = 5;
  int64 ref_added_at_nanos = 6;
  // Min/max timestamps across this ref slice (from segment indexes at plan time).
  int64 write_start_nanos = 7;
  int64 write_end_nanos = 8;
  int64 ingest_start_nanos = 9;
  int64 ingest_end_nanos = 10;
  int64 source_start_nanos = 11;
  int64 source_end_nanos = 12;
}

// AddOpenChunkSegmentRefEntry is one ref payload inside AddOpenChunkSegmentRefs.
message AddOpenChunkSegmentRefEntry {
  bytes segment_id = 1;
  uint32 first_record_number = 2;
  uint32 last_record_number = 3;
  uint64 slice_bytes = 4;
  int64 ref_added_at_nanos = 5;
  int64 write_start_nanos = 6;
  int64 write_end_nanos = 7;
  int64 ingest_start_nanos = 8;
  int64 ingest_end_nanos = 9;
  int64 source_start_nanos = 10;
  int64 source_end_nanos = 11;
}

// AddOpenChunkSegmentRefsCommand appends many segment slices in one vault-ctl
// apply so the chunking planner amortizes a single Raft quorum round-trip.
message AddOpenChunkSegmentRefsCommand {
  bytes chunk_id = 1;
  repeated AddOpenChunkSegmentRefEntry refs = 2;
}

// SealOpenChunkManifestCommand closes the open manifest for materialization.
message SealOpenChunkManifestCommand {
  bytes chunk_id = 1;
  int64 sealed_at_nanos = 2;
}

// DiscardOpenChunkManifestCommand drops an empty open or sealed-pending
// manifest without creating a chunk. Used when the planner opened a manifest
// but never planned any segment refs (stall timeout).
message DiscardOpenChunkManifestCommand {
  bytes chunk_id = 1;
}

// ReleaseSegmentsCommand drops completed segment registry entries after chunk
// replication (purge signaling). See chunking-design direction D.
message ReleaseSegmentsCommand {
  repeated bytes segment_ids = 1;
}

// AckSegmentHolderCommand records that a node has pulled, verified, and now
// holds one or more completed segments (Rubicon C). Appends node_id to each
// segment registry entry's holder set; idempotent per segment. Batched so a
// collect pass commits every receipt in one Raft apply — per-segment applies
// serialized whole passes behind the publish flood and starved GLCB builds
// (gastrolog-38snf4).
message AckSegmentHolderCommand {
  repeated bytes segment_ids = 1;
  string node_id = 2;
}

// AckChunkHolderCommand records that a node holds a sealed chunk's verified
// GLCB bytes on disk — earned by building it locally or by replica catch-up
// pull, never assumed from placement. Idempotent per chunk. Chunk residency
// (operator replica counts, RF-safety gates) reads this holder set instead
// of reporting the placement list as if it were bytes.
message AckChunkHolderCommand {
  repeated bytes chunk_ids = 1;
  string node_id = 2;
}

// RevokeChunkHolderCommand withdraws a holder claim: the node stat-missed
// the GLCB it was recorded as holding (missed builds while wedged, disk
// swap, operator deletion). Replica counts drop to the truth immediately;
// the replica catch-up pull re-earns the ack after restoring the bytes.
message RevokeChunkHolderCommand {
  repeated bytes chunk_ids = 1;
  string node_id = 2;
}

// ---------- Snapshot (replaces the 5 hand-rolled sections) ------------------

// ManifestEntry is the full metadata for one chunk in a vault's manifest. The
// proto carries every field of the Go ManifestEntry, including Hash /
// CloudServiceID / KeyScheme which the legacy 123-byte snapshot codec dropped.
message ManifestEntry {
  bytes id = 1;
  int64 write_start_nanos = 2;
  int64 write_end_nanos = 3;
  int64 record_count = 4;
  int64 bytes = 5;
  ChunkState state = 6;
  int64 disk_bytes = 7;
  int64 ingest_start_nanos = 8;
  int64 ingest_end_nanos = 9;
  int64 source_start_nanos = 10;
  int64 source_end_nanos = 11;
  bool ingest_ts_monotonic = 12;
  bool cloud_backed = 13;
  bool archived = 14;
  bool retention_pending = 15;
  int64 ingest_idx_offset = 16;
  int64 ingest_idx_size = 17;
  int64 source_idx_offset = 18;
  int64 source_idx_size = 19;
  bytes hash = 20;
  bytes cloud_service_id = 21;
  uint32 key_scheme = 22;
  // Wall-clock time when sealing completed (CmdSealChunk apply).
  int64 sealed_at_nanos = 23;
  // Node IDs holding verified GLCB bytes for this chunk (AckChunkHolder /
  // RevokeChunkHolder). Residency truth — placement says who SHOULD hold.
  repeated string holders = 24;
}

// Tombstone records a deleted chunk ID and the apply time of the delete.
message Tombstone {
  bytes chunk_id = 1;
  int64 deleted_at_nanos = 2;
}

// PendingDelete is one in-flight receipt-based deletion (gastrolog-51gme).
message PendingDelete {
  bytes chunk_id = 1;
  string reason = 2;
  int64 proposed_at_nanos = 3;
  repeated string expected_from = 4;
}

// VaultCtlSnapshot is the full point-in-time state of one vault's manifest FSM
// (replaces the hand-rolled snapshot sections).
message VaultCtlSnapshot {
  repeated ManifestEntry entries = 1;
  repeated Tombstone tombstones = 2;
  repeated PendingDelete pending_deletes = 3;
  repeated CompletedSegmentEntry completed_segments = 4;
  OpenChunkManifestState open_chunk = 5;
  // FIFO queue of sealed manifests awaiting local GLCB build on each home.
  // Multiple entries let the leader rotate the open chunk while earlier
  // chunks are still building without freezing ingest at rotation limits.
  repeated OpenChunkManifestState sealed_manifests = 6;
  repeated SegmentResumeRecordNumber segment_resume = 7;
  // Segment IDs dropped by ReleaseSegments. PublishCompletedSegment after
  // release is ignored so a stale distribution publish cannot re-register
  // metadata without bytes (permanent collection/chunking wedge).
  repeated bytes released_segment_ids = 8;
}

// VaultGroupSnapshot is the snapshot of the whole vault-ctl Raft group: one
// VaultCtlSnapshot per vault instance (replaces the GLVCTLS1 magic + per-vault
// blob framing in vaultraft/fsm.go).
message VaultGroupSnapshot {
  repeated VaultGroupSnapshotEntry vaults = 1;
}

message VaultGroupSnapshotEntry {
  bytes vault_id = 1;
  VaultCtlSnapshot snapshot = 2;
}
