syntax = "proto3";

package gastrolog.v1;

option go_package = "gastrolog/api/gen/gastrolog/v1;gastrologv1";

import "google/protobuf/timestamp.proto";

// FileStorage declares a locally-attached storage resource on a node.
// Storage class ranks local storage by speed: lower = faster.
// Multiple file storages can share the same storage class (they form a pool).
message FileStorage {
  bytes id = 1;
  uint32 storage_class = 2;
  string name = 3;
  string path = 4;
  uint64 memory_budget_bytes = 5;

  // Disk-guard free-space thresholds for this storage: an absolute size
  // ("10GB") or a percentage of the volume ("10%"), resolved against the
  // volume actually sampled. Empty inherits the node defaults (10%/3%).
  // Warn raises the disk-space alarm naming this storage; floor puts
  // every vault placed here into admission refuse (cause
  // STORAGE_DISK_PROTECT) while vaults on healthy storages keep
  // ingesting. gastrolog-9akebz: moved off VaultConfig — the thresholds
  // guard the volume, not the vaults sharing it.
  string disk_free_warn = 6;
  string disk_free_floor = 7;
}

// NodeStorageConfig declares all locally-attached storage available on a node.
message NodeStorageConfig {
  bytes node_id = 1;
  repeated FileStorage file_storages = 2;
}

// CloudStorageTransition defines a single step in an archival lifecycle chain.
// Transitions are ordered by after_days (ascending). An empty storage_class
// means "delete" (expiry).
message CloudStorageTransition {
  string after = 1;          // duration after chunk seal (e.g. "30s", "7d", "2w", "360d")
  string storage_class = 2;  // target class (e.g. "GLACIER", "DEEP_ARCHIVE", "Archive"), empty = delete
}

// CloudService defines a cluster-wide cloud storage endpoint.
// Not tied to any node. Active chunks and cached chunks live on
// local storage, referenced by storage class.
message CloudService {
  bytes id = 1;
  string name = 2;
  string provider = 3;
  string bucket = 4;
  string region = 5;
  string endpoint = 6;
  string access_key = 7;
  string secret_key = 8;
  string container = 9;
  string connection_string = 10;
  string credentials_json = 11;
  uint32 storage_class = 12;

  // Archival lifecycle configuration.
  // "none" = bucket-level lifecycle handles it (or no archival).
  // "active" = GastroLog manages transitions via the sweep job.
  string archival_mode = 13;
  repeated CloudStorageTransition transitions = 14; // ordered by after_days
  string restore_speed = 15;                         // default restore speed (S3: Expedited/Standard/Bulk, Azure: High/Standard)
  uint32 restore_days = 16;                         // S3: how long restored copy stays readable (days)
  uint32 suspect_grace_days = 17;                   // days before suspect chunk removed from index (default 7)
  string reconcile_schedule = 18;                   // cron for reconciliation sweep (default "0 3 * * *")
}

// StorageState is one storage's disk-guard state — published only by the
// node that owns the volume (only that node can statfs it) and merged
// cluster-wide via the NodeStats broadcast, the same channel VaultStats and
// VaultPipelineNodeDisk already use for per-node runtime signals
// (gastrolog-3cobq4). Identity/threshold-expression fields are config-
// derived (refreshed on the guard's discovery tick, same freshness contract
// as the rest of the disk guard); free/total/verdicts come from the last
// statfs sample. Every verdict/threshold field here is the server-computed
// value the admission gate itself consults — never a client-side
// derivation from free/total (operator directive, gastrolog-9akebz).
message StorageState {
  bytes id = 1;
  string name = 2;
  string path = 3;
  string node_name = 4;    // operator-facing node display name, pre-resolved
  uint32 storage_class = 5;
  // node_id is the owning node's raw ID, wire-encoded the same way
  // NodeStorageConfig.node_id already is ([]byte(nodeID) — a UTF-8 string
  // cast, not raw GLID bytes; frontend id.ts/glid.ts's encode() already
  // handles this dual convention). node_name stays the display label; this
  // is the stable join key for grouping/filtering storages by node
  // (gastrolog-3cobq4 review: name-based joins collide/rename-race).
  bytes node_id = 18;

  // Threshold expressions as configured on this storage ("10%", "10GB");
  // empty means this storage inherits the node-level default. The
  // *_inherited flags say so explicitly — never left for a client to infer
  // from an empty string (placeholder-style: the effective value below is
  // what matters).
  string warn_expr = 6;
  string floor_expr = 7;
  bool warn_inherited = 8;
  bool floor_inherited = 9;

  // Effective thresholds resolved in bytes against the last sampled volume
  // total — the numbers admission actually compares free space to.
  uint64 warn_bytes = 10;
  uint64 floor_bytes = 11;

  // Last statfs sample on the owning node.
  uint64 free_bytes = 12;
  uint64 total_bytes = 13;
  google.protobuf.Timestamp sampled_at = 14;

  // Server-computed verdicts (hysteresis-aware — the same state the
  // admission gate consults), never derived client-side from free/warn/floor.
  bool warn_verdict = 15;
  bool protect_verdict = 16;

  // Vault IDs with a config placement on this storage — config-derived, so
  // correct even before the next guard sample.
  repeated bytes placed_vault_ids = 17;
}
