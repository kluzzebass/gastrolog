syntax = "proto3";

package gastrolog.v1;

option go_package = "gastrolog/api/gen/gastrolog/v1;gastrologv1";

import "google/protobuf/timestamp.proto";

// VaultService provides vault and chunk management.
service VaultService {
  // ListVaults returns all registered vaults.
  rpc ListVaults(ListVaultsRequest) returns (ListVaultsResponse);

  // GetVault returns details for a specific vault.
  rpc GetVault(GetVaultRequest) returns (GetVaultResponse);

  // ListChunks returns all chunks in a vault.
  rpc ListChunks(ListChunksRequest) returns (ListChunksResponse);

  // GetChunk returns details for a specific chunk.
  rpc GetChunk(GetChunkRequest) returns (GetChunkResponse);

  // GetIndexes returns index status for a chunk.
  rpc GetIndexes(GetIndexesRequest) returns (GetIndexesResponse);

  // AnalyzeChunk returns detailed index analysis for a chunk.
  rpc AnalyzeChunk(AnalyzeChunkRequest) returns (AnalyzeChunkResponse);

  // GetStats returns overall statistics for a vault.
  rpc GetStats(GetStatsRequest) returns (GetStatsResponse);

  // ReindexVault rebuilds all indexes for sealed chunks in a vault.
  rpc ReindexVault(ReindexVaultRequest) returns (ReindexVaultResponse);

  // ValidateVault checks chunk and index integrity for a vault.
  rpc ValidateVault(ValidateVaultRequest) returns (ValidateVaultResponse);

  // ExportVault streams all records from a vault for backup.
  rpc ExportVault(ExportVaultRequest) returns (stream ExportVaultResponse);

  // ImportRecords appends a batch of records to a vault.
  rpc ImportRecords(ImportRecordsRequest) returns (ImportRecordsResponse);

  // SealVault seals the active chunk of a vault.
  rpc SealVault(SealVaultRequest) returns (SealVaultResponse);

  // RetryUnreadableChunks resets every unreadable chunk's retry backoff
  // for a vault, so the next retention sweep retries them all immediately.
  // Operator-driven recovery action; see gastrolog-25vur.
  rpc RetryUnreadableChunks(RetryUnreadableChunksRequest) returns (RetryUnreadableChunksResponse);

  // ArchiveChunk transitions a cloud-backed sealed chunk to an offline
  // storage class (Glacier, Deep Archive, Azure Archive). The chunk stays
  // in the vault but becomes unreadable until restored.
  rpc ArchiveChunk(ArchiveChunkRequest) returns (ArchiveChunkResponse);

  // RestoreChunk initiates retrieval of an archived chunk. On S3 this is
  // async (RestoreObject). The chunk becomes readable once restore completes.
  rpc RestoreChunk(RestoreChunkRequest) returns (RestoreChunkResponse);

  // WatchChunks opens a server-streaming subscription that pushes a
  // notification every time chunk metadata changes on this node (seal,
  // delete, create, cloud upload). The client uses the
  // notification as a signal to refetch via ListChunks — no chunk data
  // is carried in the stream itself. Same pattern as WatchConfig.
  // See gastrolog-1jijm.
  rpc WatchChunks(WatchChunksRequest) returns (stream WatchChunksResponse);

  // RepatriateOrphan re-introduces a sealed local chunk into the
  // vault-ctl FSM manifest. Operator-driven recovery for "unknown
  // orphans" — sealed chunks present on local disk but absent from
  // the FSM (post-restore-from-backup, FSM-glitch, etc.). Reconstructs
  // the ManifestEntry from the local chunk's idx.log headers and
  // proposes CmdRepatriateChunk to the vault-ctl FSM. Refuses if the
  // chunk is already FSM-tracked or tombstoned. See gastrolog-32bf2.
  rpc RepatriateOrphan(RepatriateOrphanRequest) returns (RepatriateOrphanResponse);

  // GetPipelineBacklog returns vault-ctl registry/manifest state plus
  // cluster-wide on-disk segment counts (working, completed, head,
  // pre-head) so operators can see chunking pipeline depth in the
  // inspector without shell access.
  rpc GetPipelineBacklog(GetPipelineBacklogRequest) returns (GetPipelineBacklogResponse);
}

message ListVaultsRequest {}

message ListVaultsResponse {
  repeated VaultInfo vaults = 1;
}

message VaultInfo {
  bytes id = 1;
  string type = 2;
  string filter = 3;
  int64 chunk_count = 4;
  int64 record_count = 5;
  bool enabled = 6;
  string name = 7;
  bytes node_id = 8;
  bool remote = 9; // True if vault lives on another node

  // Currently-applicable admission-refusal causes for this vault, as
  // computed by the responding node's admission gate (local disk guard +
  // live-peer broadcasts) — the same inputs admission itself consults, not
  // a UI-side derivation from alarm state. Empty when the vault admits
  // normally. Each entry pairs the cause with a detail string naming the
  // specifics (which storage and its free-vs-floor numbers, which bound
  // and value) — see VaultAdmissionRefusal (gastrolog-9akebz).
  repeated VaultAdmissionRefusal admission_refused = 10;
}

// VaultAdmissionCause identifies why a vault's admission gate is currently
// refusing new records for it. Mirrors
// orchestrator.VaultAdmissionCause (backend/internal/orchestrator/disk_guard.go).
enum VaultAdmissionCause {
  VAULT_ADMISSION_CAUSE_UNSPECIFIED = 0;
  VAULT_ADMISSION_CAUSE_MAX_SIZE_BOUND = 1;
  // gastrolog-9akebz: renamed from VAULT_DISK_PROTECT — the disk-free
  // thresholds moved from VaultConfig to the storage entity a vault's
  // placements reference, so the cause is a storage property, not a
  // vault one. Every vault placed on a below-floor storage refuses.
  VAULT_ADMISSION_CAUSE_STORAGE_DISK_PROTECT = 2;
  VAULT_ADMISSION_CAUSE_BACKLOG_BUDGET = 3;
  // gastrolog-5yfaqj: refuse generalized from max_size to every retention
  // policy bound. AGE_BOUND/CHUNK_COUNT_BOUND only ever appear when the
  // stating policy's refuse flag is true AND the retention runner has
  // swept and failed to clear the violation — never on the normal
  // transient between a chunk's seal and the next sweep.
  VAULT_ADMISSION_CAUSE_AGE_BOUND = 4;
  VAULT_ADMISSION_CAUSE_CHUNK_COUNT_BOUND = 5;
}

// VaultAdmissionRefusal pairs one admission-refusal cause with the
// backend's own detail text for it — facts the backend already knows at
// response time, not a client-side reconstruction (gastrolog-9akebz):
// storage protect names the storage and its free-vs-floor numbers when
// locally sampled, or "reported by <node>" for a peer-broadcast verdict
// with no local sample; bounds name the bound kind and its value. Kept
// terse — this is inspector detail text, not a log line.
message VaultAdmissionRefusal {
  VaultAdmissionCause cause = 1;
  string detail = 2;
}

message GetVaultRequest {
  bytes id = 1;
}

message GetVaultResponse {
  VaultInfo vault = 1;
}

message ListChunksRequest {
  string vault = 1;

  // When true, return only unsealed (active) chunks from this node's
  // local vaults — no cross-node fan-out. Used for lightweight 5-second
  // polling of active-chunk stats (record count, bytes) while discrete
  // events (seal, delete, cloud upload) come through the WatchChunks stream.
  // See gastrolog-1jijm.
  bool active_only = 2;
}

message ListChunksResponse {
  repeated ChunkMeta chunks = 1;

  // Set only when the cross-node fan-out that produced `chunks` could not
  // reach every peer that hosts this vault, so the merged list is a
  // partial view. Absent on the happy path (all peers contributed) — the
  // inspector shows nothing. See gastrolog-66zrj / gastrolog-1ic07.
  ContributionReport contribution_report = 2;
}

// DegradedPeer names one cluster node that failed to contribute to a
// fanned-out inspector/query merge — timed out, returned a transport
// error, or was otherwise unreachable for this request. Benign,
// expected non-answers (placement churn during reconfiguration, a peer
// that correctly reports it does not hold the requested chunk) are NOT
// degradation and never appear here.
message DegradedPeer {
  string node_id = 1; // the peer that did not contribute (glid string)
  string reason = 2;  // short human-readable cause (e.g. "timeout", transport error text)
}

// ContributionReport accompanies any fanned-out inspector/query merge so
// a partial result reads as visibly partial instead of silently so. It
// is only attached when at least one peer failed to contribute; a fully
// successful fan-out omits it entirely (quiet-until-needed). Consumers
// treat a present-but-empty report the same as absent. See
// gastrolog-66zrj.
message ContributionReport {
  repeated DegradedPeer degraded = 1;
}

// ChunkState is the lifecycle stage of a chunk on the vault-ctl FSM.
//
// Active   — accepting appends; only the leader's bytes are authoritative;
//            followers maintain a best-effort active-form mirror via
//            record streaming as a leadership-transfer safety net.
// Sealing  — leader has stopped accepting appends and is assembling the
//            sealed-form GLCB (writing data.glcb, building indexes,
//            computing the integrity digest). Cluster reads are still
//            served from the active-form layout — the sealed-form is in
//            flight but not yet committed.
// Sealed   — the leader has committed the sealed-form GLCB and the FSM
//            entry carries the integrity digest. Followers may now
//            replicate the sealed form byte-for-byte from the leader.
//
// gastrolog-1huz5.
enum ChunkState {
  CHUNK_STATE_UNSPECIFIED = 0;
  CHUNK_STATE_ACTIVE = 1;
  CHUNK_STATE_SEALING = 2;
  CHUNK_STATE_SEALED = 3;
}

message ChunkMeta {
  bytes id = 1;
  google.protobuf.Timestamp write_start = 2;
  google.protobuf.Timestamp write_end = 3;
  // sealed is the legacy two-state flag; transitionally true when state
  // == CHUNK_STATE_SEALED. New consumers should read state directly so
  // they can branch on Sealing explicitly. gastrolog-1huz5.
  bool sealed = 4;
  int64 record_count = 5;
  int64 bytes = 6;
  // disk_bytes is the LOCAL on-disk footprint on the responding node, always
  // — for a cloud-backed chunk this is the warm-cache state (the cached
  // GLCB's size while cached, 0 once evicted), never the cloud object size.
  int64 disk_bytes = 7;
  google.protobuf.Timestamp ingest_start = 8;
  google.protobuf.Timestamp ingest_end = 9;
  bool cloud_backed = 10; // true = chunk lives in cloud storage (S3/Azure/GCS)
  bool archived = 11;     // true = chunk is in offline storage class (Glacier, Azure Archive)
  bytes vault_id = 12;    // which vault this chunk belongs to
  string vault_type = 13;  // vault type: "memory", "file", "jsonl"
  bool retention_pending = 14; // true = chunk is marked for retention processing
  string storage_class = 15;   // current cloud storage class (e.g. "GLACIER", "cold", "Archive")
  int32 replica_count = 16;    // how many nodes currently have this chunk (leader + followers that have caught up)
  // Cluster-wide replica residency: the set of node IDs that reported having
  // this chunk locally during the most recent ListChunks fan-out. Lets the
  // inspector show which nodes physically hold each replica, distinct from
  // placement (which says where the chunk SHOULD live, not where it does).
  // See gastrolog-51gme.
  repeated string replica_node_ids = 17;
  // Receipt-protocol pending acks: when a chunk is in pendingDeletes (i.e. a
  // CmdRequestDelete has been proposed but the cluster hasn't fully drained
  // the per-node acks), this is the set of node IDs that still owe an ack.
  // Empty/absent for chunks not currently in pendingDeletes. Lets the
  // inspector show which specific node is the laggard holding up a stuck
  // delete. See gastrolog-51gme.
  repeated string pending_ack_node_ids = 18;
  // Three-state lifecycle (gastrolog-1huz5). When unset for replay of
  // pre-Phase-3 entries, callers derive the state from the legacy
  // sealed bool: state == SEALED iff sealed == true.
  ChunkState state = 19;
  // cloud_bytes is the compressed cloud object's transport size for a
  // cloud-backed chunk (0 = never uploaded). Cluster-wide fact, distinct
  // from disk_bytes (per-node, live warm-cache state). gastrolog-33ul6h.
  int64 cloud_bytes = 20;
}

message GetChunkRequest {
  string vault = 1;
  bytes chunk_id = 2;
}

message GetChunkResponse {
  ChunkMeta chunk = 1;
}

message GetIndexesRequest {
  string vault = 1;
  bytes chunk_id = 2;
}

message GetIndexesResponse {
  bool sealed = 1;
  repeated IndexInfo indexes = 2;

  // Set only when the chunk was NOT located and the fan-out could not
  // reach every peer that hosts the vault — the "not found" result is
  // then uncertain (an unreachable peer might hold the chunk), so the
  // response degrades to empty-with-report instead of a hard not-found.
  // Absent when the chunk was found or when every peer answered. See
  // gastrolog-1ic07.
  ContributionReport contribution_report = 3;
}

message IndexInfo {
  string name = 1;
  bool exists = 2;
  int64 entry_count = 3;
  int64 size_bytes = 4;
}

message AnalyzeChunkRequest {
  string vault = 1;
  bytes chunk_id = 2; // If empty, analyze all chunks
}

message AnalyzeChunkResponse {
  repeated ChunkAnalysis analyses = 1;
}

message ChunkAnalysis {
  bytes chunk_id = 1;
  bool sealed = 2;
  int64 record_count = 3;
  repeated IndexAnalysis indexes = 4;
}

message IndexAnalysis {
  string name = 1;
  bool complete = 2;
  string status = 3; // "ok", "missing", "incomplete", "capped"
  int64 entry_count = 4;
  double coverage = 5; // 0.0 to 1.0
  map<string, string> details = 6;
}

message GetStatsRequest {
  string vault = 1; // If empty, aggregate across all vaults
}

message GetStatsResponse {
  int64 total_vaults = 1;
  int64 total_chunks = 2;
  int64 sealed_chunks = 3;
  int64 total_records = 4;
  int64 total_bytes = 5;
  google.protobuf.Timestamp oldest_record = 6;
  google.protobuf.Timestamp newest_record = 7;
  repeated VaultStats vault_stats = 8;
  double process_cpu_percent = 9;            // CPU usage as percentage (0-100+)
  int64 process_memory_bytes = 10;           // Summary: HeapInuse + StackInuse
  ProcessMemoryStats process_memory_stats = 11;
}

// ProcessMemoryStats provides detailed memory breakdown from the Go runtime.
message ProcessMemoryStats {
  int64 rss_bytes = 1;            // Peak RSS from OS (getrusage Maxrss)
  int64 heap_alloc_bytes = 2;     // Live heap object bytes
  int64 heap_inuse_bytes = 3;     // In-use heap span bytes
  int64 heap_idle_bytes = 4;      // Idle (unused) heap span bytes
  int64 heap_released_bytes = 5;  // Heap bytes released to OS
  int64 stack_inuse_bytes = 6;    // Stack span bytes
  int64 sys_bytes = 7;            // Total virtual memory from OS
  uint64 heap_objects = 8;        // Number of live heap objects
  uint32 num_gc = 9;              // Completed GC cycles
}

// VaultStats provides per-vault statistics.
// ThroughputRate is one rate series: the instantaneous rate (delta over the
// ~5s between stats ticks) with its per-tick spark history for reading burst
// shape, plus Unix-load-style exponentially weighted moving averages at
// 1m/5m/15m for sustained rates. EWMAs keep one number per horizon — no
// history buffer — folding each tick's sample in with e^(-dt/tau) decay,
// exactly the kernel's load-average technique (gastrolog-4eh5ns).
message ThroughputRate {
  double instant_per_sec = 1;
  double avg_1m_per_sec = 2;
  double avg_5m_per_sec = 3;
  double avg_15m_per_sec = 4;
  repeated double spark = 5;
}

message VaultStats {
  bytes id = 1;
  string type = 2;
  int64 chunk_count = 3;
  int64 sealed_chunks = 4;
  int64 active_chunks = 5;
  int64 record_count = 6;
  int64 data_bytes = 7;
  int64 index_bytes = 8;
  google.protobuf.Timestamp oldest_record = 9;
  google.protobuf.Timestamp newest_record = 10;
  bool enabled = 11;
  string name = 12;
  // raft_applied_index is the local node's vault-ctl Raft applied
  // index for this vault. Broadcast in NodeStats so the per-vault-ctl
  // learner promoter (gastrolog-gcbx7) can observe each follower's
  // catchup progress without a dedicated RPC. Zero if the local node
  // has no vault-ctl group for this vault (e.g. vault placed
  // elsewhere) or Raft is not yet initialized.
  uint64 raft_applied_index = 13;

  // Segmentation append throughput on THIS node (origin side), from the
  // stats collector's rolling windows over the writer's cumulative
  // counters. Zero when the vault has no local segmentation writer.
  // append_records counts frames appended to the working segment;
  // append_durable counts records released by a successful group commit —
  // the gap between them plus the queue depth is the write-path
  // backpressure picture (gastrolog-4eh5ns).
  ThroughputRate append_records = 14;
  ThroughputRate append_bytes = 15;
  ThroughputRate append_durable = 16;
  uint64 append_records_total = 17;
  uint64 append_bytes_total = 18;
  uint32 append_queue_depth = 19;
  uint32 append_queue_capacity = 20;

  // Downstream pipeline stage throughput on THIS node (home side):
  // collected = records/bytes arriving in head/ (remote pull or local
  // promotion); sealed = records/bytes materialized into sealed GLCBs.
  // Together with append (origin side) these give the three-stage
  // append -> collected -> sealed readout; a downstream rate falling away
  // from its upstream is a pipeline stall in progress (gastrolog-10n6k8).
  ThroughputRate collected_records = 21;
  ThroughputRate collected_bytes = 22;
  ThroughputRate sealed_records = 23;
  ThroughputRate sealed_bytes = 24;

  // Discrete pipeline stage-count milestones on THIS node, monotonic per vault
  // (gastrolog-4r784a). These are the counters operators previously grepped
  // from cluster.log — now first-class, cross-node observable. Each milestone
  // is counted exactly once by its owner (origin/home/leader), so cluster
  // totals are the plain sum across nodes. Rates are computed by the stats
  // collector's rolling windows over these totals (fields 35-38) just like
  // append/collected/sealed — never accumulated client-side.
  //
  // Records ingested (append_records_total, field 17) and sealed
  // (sealed_records, field 23) already cover the record-throughput ends of the
  // pipeline; these add the segment- and chunk-lifecycle event counts between.
  uint64 segments_completed_total = 25;   // working/ → completed/ promotions (origin)
  uint64 segments_published_total = 26;   // committed to the vault-ctl registry (origin)
  uint64 segments_released_total = 27;    // released from the registry (leader)
  uint64 chunks_planned_total = 28;       // open manifests opened (leader)
  uint64 chunks_built_total = 29;         // sealed GLCBs materialized (home)
  uint64 chunks_sealed_total = 30;        // CmdSealChunk commits (leader)
  uint64 head_purges_total = 31;          // segments purged from head/ (home)
  uint64 glcb_pulls_attempted_total = 32; // GLCB replica catch-up pulls started
  uint64 glcb_pulls_failed_total = 33;    // catch-up pulls that no peer could satisfy
  uint64 retention_deletes_total = 34;    // chunks deleted by retention (leader)

  // Server-windowed per-second rates for the discrete stage milestones, from
  // the stats collector's rolling windows over the cumulative totals above.
  // Same mechanism as append_records/collected_records/sealed_records — the UI
  // renders them directly and never differentiates counters itself.
  ThroughputRate segments_completed_rate = 35;
  ThroughputRate segments_published_rate = 36;
  ThroughputRate chunks_built_rate = 37;
  ThroughputRate chunks_sealed_rate = 38;
}

message ReindexVaultRequest {
  string vault = 1;
}

message ReindexVaultResponse {
  bytes job_id = 4;
}

message ValidateVaultRequest {
  string vault = 1;
}

message ValidateVaultResponse {
  bool valid = 1;
  repeated ChunkValidation chunks = 2;
}

message ChunkValidation {
  bytes chunk_id = 1;
  bool valid = 2;
  repeated string issues = 3;
}

// ExportVault streams all records from a vault.
message ExportVaultRequest {
  string vault = 1;
}

message ExportVaultResponse {
  repeated ExportRecord records = 1;
}

// ExportRecord is a portable record representation for export/import and
// cross-node search results. The ref fields are optional — only populated
// when the record originates from a search (not import/export).
message ExportRecord {
  google.protobuf.Timestamp source_ts = 1;
  google.protobuf.Timestamp ingest_ts = 2;
  map<string, string> attrs = 3;
  bytes raw = 4;

  // Record reference (populated by ForwardSearch, empty for import/export).
  bytes vault_id = 5;
  bytes chunk_id = 6;
  uint64 pos = 7;

  // Original write timestamp. Populated during cross-node migration to
  // preserve chunk ordering on the destination node.
  google.protobuf.Timestamp write_ts = 8;

  // EventID fields for record identity and deduplication.
  uint32 ingest_seq = 9;   // Per-ingester rolling sequence counter
  bytes ingester_id = 10;  // 16-byte GLID
  bytes node_id = 11;      // 16-byte GLID — emitting node, disambiguates parallel ingesters
}

// ImportRecords appends a batch of records to a vault.
message ImportRecordsRequest {
  string vault = 1;
  repeated ExportRecord records = 2;
}

message ImportRecordsResponse {
  int64 records_imported = 1;
}

message SealVaultRequest {
  string vault = 1;
}

message SealVaultResponse {
  int32 sealed_count = 1; // number of vaults whose active chunk was sealed
}

message RetryUnreadableChunksRequest {
  string vault = 1;
}

message RetryUnreadableChunksResponse {
  int32 retried_count = 1; // number of chunks whose backoff was reset
}

message ArchiveChunkRequest {
  string vault = 1;
  bytes chunk_id = 2;
  string storage_class = 3; // Target: "GLACIER", "DEEP_ARCHIVE", "Archive"
}

message ArchiveChunkResponse {}

message RestoreChunkRequest {
  string vault = 1;
  bytes chunk_id = 2;
  string restore_speed = 3; // "Expedited"/"Standard"/"Bulk" (S3), "High"/"Standard" (Azure)
  int32 restore_days = 4;  // How long restored copy stays readable (S3 only, 0 = provider default)
}

message RestoreChunkResponse {}

message WatchChunksRequest {}

// ChunkChangeOp identifies what changed about a chunk in a WatchChunks event.
// Clients use the op to decide how to mutate their local state: CREATED and
// SEALED carry a full ChunkMeta and replace the cache entry; PROGRESS carries
// only a new record_count and patches the active chunk in place; DELETED
// removes the entry; UPLOADED transitions cloud_backed to true.
enum ChunkChangeOp {
  CHUNK_CHANGE_OP_UNSPECIFIED = 0;
  CHUNK_CHANGE_OP_CREATED = 1;
  CHUNK_CHANGE_OP_PROGRESS = 2;
  CHUNK_CHANGE_OP_SEALED = 3;
  CHUNK_CHANGE_OP_DELETED = 4;
  CHUNK_CHANGE_OP_UPLOADED = 5;
}

// WatchChunksResponse carries a single chunk-state change event. Replaces the
// bare wake-up counter that forced clients to re-fetch ListChunks on every
// notification, which produced O(vaults × ticks/sec) RPCs under steady-state
// ingest. Each message describes exactly what changed so the client can patch
// its local cache via setQueryData and avoid the fan-out entirely. See
// gastrolog-3pf9w.
message WatchChunksResponse {
  // vault_id identifies which vault's chunk changed. Required.
  bytes vault_id = 1;

  // chunk_id identifies which chunk changed. Required for all ops except
  // UNSPECIFIED.
  bytes chunk_id = 2;

  // op is the change kind. See ChunkChangeOp.
  ChunkChangeOp op = 3;

  // meta is the full post-change chunk metadata. Present for CREATED,
  // SEALED, and UPLOADED. Absent for PROGRESS and DELETED.
  ChunkMeta meta = 4;

  // record_count is the post-change record count of the active chunk.
  // Present for PROGRESS only (CREATED / SEALED include it inside meta).
  uint64 record_count = 5;

  // version is a per-node monotonic counter, incremented for every event
  // emitted on this node's stream. Clients track the high-watermark per
  // node and detect dropped events on reconnect by comparing the first
  // post-reconnect version against last_seen + 1 — a gap means the client
  // should cold-start with ListChunks for that node's vaults before
  // resuming.
  uint64 version = 6;

  // node_id identifies which cluster node produced this event. The API
  // node multiplexes its own ChunkBus events plus events from every peer
  // cluster node's bus into a single stream to the client; node_id lets
  // the client maintain a per-node high-watermark for resync. Empty for
  // events from the connected node itself.
  bytes node_id = 7;
}

// RepatriateOrphanRequest names a sealed local chunk to re-introduce
// into the vault-ctl FSM manifest. The chunk must exist on the
// receiving node's local disk for the named vault; the call is rejected
// otherwise. See gastrolog-32bf2.
message RepatriateOrphanRequest {
  string vault = 1;
  bytes chunk_id = 2;
}

message RepatriateOrphanResponse {}

message GetPipelineBacklogRequest {
  string vault = 1;
}

message GetPipelineBacklogResponse {
  VaultPipelineBacklog backlog = 1;

  // Set only when the cross-node fan-out that summed per-node on-disk
  // segment counts could not reach every peer — the cluster-wide totals
  // then omit some node's segments. Absent when every peer contributed.
  // See gastrolog-1ic07.
  ContributionReport contribution_report = 2;
}

// VaultPipelineBacklog surfaces chunking pipeline depth for one vault.
// Registry and manifest fields come from the replicated vault-ctl FSM
// (identical on every voter). Segment counts are summed across all
// cluster nodes — every node is an ingest origin, and home nodes hold
// head/pre-head copies after distribution.
message VaultPipelineBacklog {
  bytes vault_id = 1;

  // vault-ctl completed-segment registry (replicated).
  uint32 registry_segments = 2;
  uint32 eligible_segments = 3;
  uint64 registry_records = 4;

  // Open manifest being filled by the chunking planner.
  uint32 open_manifest_refs = 5;
  uint64 open_manifest_records = 6;
  google.protobuf.Timestamp open_manifest_ingest_end = 7;

  // Sealed manifest awaiting local GLCB build on homes.
  bool sealed_manifest_pending = 8;

  // On-disk segment file counts (cluster-wide sum).
  uint32 working_segments = 10;
  uint32 completed_staging_segments = 11;
  uint32 head_segments = 12;
  uint32 pre_head_segments = 13;

  // Oldest LastIngestTS among registry segments still eligible for
  // planning — how far behind wall clock unchunked data may be.
  google.protobuf.Timestamp oldest_eligible_last_ingest = 14;

  // vault-ctl Raft leader for this vault (chunking planner runs here).
  bytes vault_ctl_leader_node_id = 15;
  bool connected_node_is_vault_ctl_leader = 16;

  // Per-node on-disk segment counts. Every cluster node may act as an ingest
  // origin (working/completed); home nodes also hold head/pre-head copies.
  repeated PipelineNodeSegments node_segments = 17;

  // Cluster-wide on-disk segment byte totals (summed across nodes).
  uint64 working_bytes = 18;
  uint64 completed_staging_bytes = 19;
  uint64 head_bytes = 20;
  uint64 pre_head_bytes = 21;
}

// PipelineNodeSegments is one node's pipeline storage areas for a vault.
message PipelineNodeSegments {
  bytes node_id = 1;
  uint32 working_segments = 2;
  uint32 completed_staging_segments = 3;
  uint32 head_segments = 4;
  uint32 pre_head_segments = 5;
  uint64 working_bytes = 6;
  uint64 completed_staging_bytes = 7;
  uint64 head_bytes = 8;
  uint64 pre_head_bytes = 9;
}
