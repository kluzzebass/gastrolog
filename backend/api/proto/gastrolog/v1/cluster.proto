syntax = "proto3";
package gastrolog.v1;

import "google/protobuf/timestamp.proto";
import "gastrolog/v1/job.proto";
import "gastrolog/v1/query.proto";
import "gastrolog/v1/storage.proto";
import "gastrolog/v1/system.proto";
import "gastrolog/v1/vault.proto";

option go_package = "gastrolog/api/gen/gastrolog/v1;gastrologv1";

// ForwardApplyRequest carries a pre-marshaled ConfigCommand for the leader
// to apply via raft.Apply(). Used by followers to proxy config writes.
message ForwardApplyRequest {
  bytes command = 1;
}

// ForwardApplyResponse carries the Raft log index at which the leader
// applied the command. The follower uses this to wait for its own FSM
// to catch up before reading post-mutation state. See gastrolog-2nxij.
message ForwardApplyResponse {
  uint64 applied_index = 1;
}

// EnrollRequest is sent by a joining node to the cluster leader.
// The token_secret proves the node is authorized to join.
message EnrollRequest {
  string token_secret = 1;
  bytes node_id = 2;
  string node_addr = 3;
}

// EnrollResponse returns the cluster TLS material to the joining node.
message EnrollResponse {
  bytes ca_cert_pem = 1;
  bytes cluster_cert_pem = 2;
  bytes cluster_key_pem = 3;
}

// BroadcastRequest sends a typed message to a peer node.
message BroadcastRequest {
  BroadcastMessage message = 1;
}

message BroadcastResponse {}

// BroadcastMessage is the envelope for all peer-to-peer broadcast messages.
// The oneof payload makes it extensible — new message types are added as
// new variants without breaking existing receivers.
message BroadcastMessage {
  bytes sender_id = 1;
  google.protobuf.Timestamp timestamp = 2;

  oneof payload {
    NodeStats node_stats = 10;
    NodeJobs node_jobs = 11;
  }
}

// NodeJobs reports active job state for a single cluster node.
// Broadcast periodically and immediately on job completion/failure.
message NodeJobs {
  repeated Job jobs = 1;
}

// NodeStats reports runtime statistics for a single cluster node.
message NodeStats {
  double cpu_percent = 1;
  uint64 memory_inuse = 2;
  uint64 memory_rss = 3;
  uint64 memory_heap_alloc = 4;
  uint64 memory_sys = 5;
  uint32 goroutines = 6;
  uint32 ingest_queue_depth = 7;
  uint32 ingest_queue_capacity = 8;
  repeated VaultStats vaults = 9;
  repeated IngesterNodeStats ingesters = 10;

  // Identity
  string node_name = 11;
  string version = 12;
  string raft_state = 13;
  string suffrage = 14;
  int64 uptime_seconds = 15;

  // Memory detail
  uint64 memory_heap_idle = 16;
  uint64 memory_heap_released = 17;
  uint64 memory_stack_inuse = 18;
  uint64 memory_heap_objects = 19;
  uint32 num_gc = 20;

  // Raft
  uint64 raft_term = 21;
  uint64 raft_commit_index = 22;
  uint64 raft_applied_index = 23;
  string raft_last_contact = 24;
  uint64 raft_fsm_pending = 25;

  // Addresses (advertised via broadcast so peers know each other's endpoints)
  string api_address = 26;        // HTTP API address (e.g. ":4564")
  string pprof_address = 27;      // pprof HTTP address, empty if disabled

  // Route stats (aggregated cluster-wide by GetRouteStats RPC)
  int64 route_stats_routed = 28;
  int64 route_stats_unmatched = 29;
  int64 route_stats_matched = 30;
  bool route_stats_route_table_active = 31;
  repeated gastrolog.v1.VaultRouteStats route_vault_stats = 32;
  repeated gastrolog.v1.PerRouteStats route_per_route_stats = 33;

  // Active system alerts on this node.
  repeated SystemAlert alerts = 34;

  // Per-node outbound peer connection catalog (service pools + raft singletons).
  // Populated from PeerConnManager on each broadcast tick. See gastrolog-1dg8z.
  repeated PeerConnStat peer_connections = 35;

  // Per-peer sum of this node's peer_connections. Inspector merges both peers'
  // lane rows client-side for the full link view. See gastrolog-5uyy6.
  repeated PeerTrafficTotal peer_traffic_totals = 38;

  // Per-vault on-disk pipeline segment counts on this node (working/completed
  // at origins; head/pre-head on homes). Aggregated cluster-wide by
  // WatchSystemStatus for the inspector.
  repeated VaultPipelineNodeDisk vault_pipeline_disk = 36;

  // Total on-disk bytes on this node: local chunk/index stores, pipeline
  // segments (FSM ByteSize where published, otherwise file stat), raft
  // persistence, and managed files. Distinct from per-vault data_bytes.
  int64 storage_bytes = 37;

  // Routing throughput on this node, from the stats collector's rolling
  // windows over the cumulative route counters (fields 28/30). Cluster
  // totals are the sum across nodes (gastrolog-4eh5ns).
  gastrolog.v1.ThroughputRate route_routed = 39;
  gastrolog.v1.ThroughputRate route_matched = 40;

  // Raft liveness / WAL health (gastrolog-1io54g). Append latency covers
  // every Raft WAL on the node (vault groups share one WAL; cluster-ctl has
  // its own): count/total are cumulative, avg is the rolling-window average
  // between stats ticks, max is the worst single append since the previous
  // tick. Election counters aggregate hashicorp/raft observer events across
  // all groups — elections_per_min > ~3 sustained is a storm.
  uint64 raft_wal_appends_total = 41;
  double raft_wal_append_avg_ms = 42;
  double raft_wal_append_max_ms = 43;
  uint64 raft_elections_total = 44;
  uint64 raft_leader_losses_total = 45;
  uint64 raft_failed_heartbeats_total = 46;
  double raft_elections_per_min = 47;

  // Vaults with a placement on a storage, THIS node hosts, that is below
  // its free-space floor. Every node's admission gate honors the union
  // across live peers, so a starved storage anywhere in the cluster
  // suspends new records for every vault placed on it at every front
  // door while vaults on healthy storages keep ingesting. Renamed from
  // disk_protected_vault_ids (gastrolog-9akebz: thresholds moved from
  // VaultConfig to the storage entity; still vault-keyed — the node that
  // samples the storage already knows which of its OWN vaults are placed
  // on it, so the broadcast shape didn't need to become storage-keyed).
  repeated bytes storage_protected_vault_ids = 48;

  // Vaults whose local disk claim on THIS node has reached their per-node
  // max-size bound. Honored cluster-wide by the same per-vault admission
  // gate as storage_protected_vault_ids, with a bound-specific error.
  repeated bytes size_capped_vault_ids = 49;

  // Vaults whose max-age retention bound is still violated after this
  // node's retention runner swept and failed to clear it, on a policy
  // with refuse=true (gastrolog-5yfaqj). Unlike size_capped_vault_ids this
  // is NOT instantaneous — see RetentionPolicyConfig.refuse. Honored
  // cluster-wide by the same per-vault admission gate.
  repeated bytes age_bound_vault_ids = 52;

  // Vaults whose max-chunks retention bound is still violated after a
  // failed sweep, on a policy with refuse=true. Same contract as
  // age_bound_vault_ids.
  repeated bytes chunk_count_bound_vault_ids = 53;

  // Cumulative diagnostic log records this node's capture handler has
  // discarded because the capture channel was full. A capacity signal with
  // no operator action, so it is a metric and never an alarm
  // (gastrolog-3phtqv). It is deliberately not logged either: a log line
  // about dropped logs feeds the self-ingester that is dropping them.
  uint64 self_ingester_drops_total = 50;

  // Current ingest-pipeline pressure: "normal", "elevated", or "critical".
  // PressureAware ingesters throttle themselves as this rises. A metric, not
  // an alarm (gastrolog-3phtqv): the actionable end of a backed-up pipeline
  // is already covered by the pipeline-backlog and disk-space alarms, which
  // fire when the backlog actually threatens something. Like raft_state,
  // this is the level's String() rather than an enum.
  string ingest_pressure_level = 51;

  // Per-storage disk-guard state for storages LOCALLY hosted on this node —
  // only the owning node can statfs its volume (gastrolog-3cobq4). Bounded
  // by the node's own NodeStorageConfig entries. Aggregated cluster-wide the
  // same way VaultStats/VaultPipelineDisk are: each node reports its own,
  // PeerState merges across live peers for the storage inspector.
  repeated StorageState storages = 54;
}

// VaultPipelineNodeDisk is one vault's local pipeline storage areas on a
// single node, included in the periodic NodeStats broadcast.
message VaultPipelineNodeDisk {
  bytes vault_id = 1;
  uint32 working_segments = 2;
  uint32 completed_staging_segments = 3;
  uint32 head_segments = 4;
  uint32 pre_head_segments = 5;
}

// PeerConnStat reports one managed outbound cluster gRPC connection on this node.
message PeerConnStat {
  string peer = 1;
  string lane = 2;              // "service" | "raft"
  string group_id = 3;          // empty for service lane
  repeated string purposes = 4; // active subsystem labels
  string connectivity = 5;
  int32 pool_index = 6;         // 0 for raft singletons
  int64 bytes_sent = 7;
  int64 bytes_received = 8;
  double tx_bytes_per_sec = 9;
  double rx_bytes_per_sec = 10;
  repeated double tx_spark = 11;
  repeated double rx_spark = 12;
  // Subsystems that acquired this connection since the previous stats snapshot
  // (union of brief holds that may not appear in purposes at tick time).
  repeated string purposes_window = 13;
}

// PeerTrafficTotal is the per-peer sum of this node's peer_connections.
message PeerTrafficTotal {
  string peer = 1;
  int64 bytes_sent = 2;
  int64 bytes_received = 3;
  double tx_bytes_per_sec = 4;
  double rx_bytes_per_sec = 5;
  repeated double tx_spark = 6;
  repeated double rx_spark = 7;
}

// SystemAlert is one standing alarm: a runtime condition requiring operator
// action, with priority, cause and response stamped from the static alarm
// catalog — never chosen at the raising call site.
// Alarms are keyed by ID for deduplication — the same condition doesn't
// create multiple alarms. Alarms are STATE with suppression: they stand
// while the condition holds and clear when it resolves — an alarm is
// standing or it is not; there are no per-alarm operator states. Latching
// alarms stand until process restart.
message SystemAlert {
  bytes id = 1;                            // stable key for dedup (e.g. "vault-init:$vaultID")
  AlarmPriority priority = 2;              // from the alarm catalog, never the call site
  string source = 3;                       // component name (e.g. "placement", "chunking")
  string detail = 4;                       // per-instance specifics from the raiser
  // Condition start of the current occurrence (the first Raise of the
  // occurrence, not the annunciation instant — a delay-on window suppresses
  // annunciation, not the condition's history). This IS the design doc's
  // "first_raised"; no separate field exists.
  google.protobuf.Timestamp first_seen = 5;
  google.protobuf.Timestamp last_seen = 6;
  string cause = 7;                        // catalog: what condition this is
  string response = 8;                     // catalog: what the operator should do
  // Software faults are defect tripwires, a class apart from process alarms
  // (EEMUA 191): their response is to report the defect, so they sit outside
  // the consequence × urgency priority scale (priority is UNSPECIFIED).
  bool software_fault = 9;
}

// AlarmPriority is the cataloged consequence × urgency verdict for an alarm
// type. CRITICAL = data loss in progress or scheduled; HIGH = durability or
// availability degraded, will compound; LOW = needs attention on a human
// timescale. UNSPECIFIED is only carried by software faults.
enum AlarmPriority {
  ALARM_PRIORITY_UNSPECIFIED = 0;
  ALARM_PRIORITY_LOW = 1;
  ALARM_PRIORITY_HIGH = 2;
  ALARM_PRIORITY_CRITICAL = 3;
}

// IngesterNodeStats reports per-ingester statistics on a cluster node.
message IngesterNodeStats {
  bytes id = 1;
  uint64 messages_ingested = 2;
  uint64 bytes_ingested = 3;
  uint64 errors = 4;
  bool running = 5;
  string name = 6;
}

// ForwardVaultApplyRequest carries a pre-marshaled vault control-plane Raft
// command for the leader to apply. group_id is the vault-ctl group
// (vault/<vaultGLID>/ctl); command is the marshaled FSM command bytes
// (typically OpVaultChunkFSM + vault-instance GLID + vaultctlfsm wire
// payload, see vaultraft.MarshalVaultChunkCommand).
message ForwardVaultApplyRequest {
  // UTF-8 vault control-plane group id: vault/<vaultGLID>/ctl
  bytes group_id = 1;
  bytes command = 2;
}

// ForwardVaultApplyResponse carries the Raft log index at which the vault-ctl
// group leader applied the forwarded command. The forwarding follower blocks
// until its own group FSM has applied up to this index before returning, so
// an immediate local read sees post-mutation state — the same read-after-write
// barrier ForwardApplyResponse provides for the cluster-ctl group
// (gastrolog-2nxij, gastrolog-4l24u).
message ForwardVaultApplyResponse {
  uint64 applied_index = 1;
}

// --- Chunk Replication Protocol ---
//
// A single ordered bidirectional stream per vault per follower. Unifies
// record forwarding (fire-and-forget) and sealed chunk replacement
// (one-shot) so all chunk operations for a vault are sequenced on one
// stream, eliminating the race between record forwarding and sealed
// chunk replacement. Chunks are vault-keyed.

// ChunkReplicationCommand is sent leader → follower. The vault_id
// identifies the target vault; the oneof command determines the
// operation. New command types can be added without changing framing.
message ChunkReplicationCommand {
  bytes vault_id = 1;

  oneof command {
    // Sealed-chunk import is a three-phase sequence on the same stream:
    // ImportBegin → 1..N ImportRecords frames → ImportCommit. Replaces
    // a legacy single-frame ChunkReplicationImport that packed the whole
    // chunk into one message; chunks past the gRPC receive cap wedged
    // the catchup path forever. See gastrolog-4yvhh.
    ChunkReplicationImportBegin import_begin = 10;
    ChunkReplicationImportRecords import_records = 11;
    ChunkReplicationImportCommit import_commit = 12;
  }
}

// ChunkReplicationImportBegin opens a streaming sealed-chunk import.
// The follower stages an import context keyed by chunk_id and ack's
// success; subsequent ImportRecords frames push batches of records
// into that staged context until ImportCommit finalizes the import.
// Each (vault, follower) stream allows at most one import in flight.
message ChunkReplicationImportBegin {
  bytes chunk_id = 1;
}

// ChunkReplicationImportRecords carries one bounded batch of records
// for the in-flight import. Frame size is capped on the leader side so
// no individual gRPC message exceeds the receive limit regardless of
// chunk size. The follower consumes records record-by-record and
// applies backpressure: the ack is not sent until the importer has
// pulled every record in the frame.
message ChunkReplicationImportRecords {
  repeated ExportRecord records = 1;
}

// ChunkReplicationImportCommit finalizes the in-flight import. The
// follower closes its record-source channel, waits for the importer
// goroutine to drain and return, and acks with the importer's result.
// chunk_id is echoed for sanity-checking against ImportBegin.
message ChunkReplicationImportCommit {
  bytes chunk_id = 1;
}

// ChunkReplicationAck is sent follower → leader after each command.
message ChunkReplicationAck {
  bool ok = 1;
  string error = 2;
  bytes chunk_id = 3; // echoes the chunk_id from the command
}

// RequestReplicaCatchupRequest is sent follower → placement leader. The
// follower computes the local FSM-vs-disk diff in its lifecycle reconciler
// (SweepMissingReplicas) and asks the leader to re-push specific sealed
// chunks via the streaming ChunkReplicationImport{Begin,Records,Commit}
// path. Used to recover from replication pushes that failed during a
// follower pause / partition / rejoin window — see gastrolog-2dgvj.
message RequestReplicaCatchupRequest {
  bytes vault_id = 1;
  repeated bytes chunk_ids = 2;        // 16-byte ChunkIDs
  bytes requester_node_id = 3;         // utf-8 node ID of the requesting follower
}

// RequestReplicaCatchupResponse acknowledges receipt of the catchup
// request. The leader fans the actual pushes out asynchronously via
// existing replicateToFollower machinery, so success here means
// "request accepted, pushes scheduled" — not "all chunks delivered".
// The follower will re-request anything still missing on its next
// sweep tick if the leader's pushes fail.
message RequestReplicaCatchupResponse {
  uint32 scheduled = 1; // number of chunk pushes scheduled (after leader-side filtering)
}

// ForwardSearchRequest is sent to a replica holder node to execute a
// scoped search locally and return matching records. When sealed_chunk_ids
// is empty and search_pipeline_chunks is false, the holder runs a legacy
// leader-only full-vault search (backward compatible).
message ForwardSearchRequest {
  bytes vault_id = 1;
  string query = 2;
  bytes resume_token = 3; // resume token for pagination across pages
  repeated bytes sealed_chunk_ids = 4; // sealed chunks this holder should scan
  bool search_pipeline_chunks = 5; // include active/sealing chunks (leader only)
}

message ForwardSearchResponse {
  repeated ExportRecord records = 1;
  bytes resume_token = 2;
  bool has_more = 3;
  TableResult table_result = 4;          // Pipeline results (timechart, stats)
  repeated HistogramBucket histogram = 5; // Volume histogram from this node's vaults
}

// ForwardGetContextRequest asks a remote node to return records surrounding
// a specific record in one of its local vaults.
message ForwardGetContextRequest {
  bytes vault_id = 1;
  bytes chunk_id = 2;
  uint64 pos = 3;
  int32 before = 4;
  int32 after = 5;
}

message ForwardGetContextResponse {
  repeated ExportRecord before = 1;
  ExportRecord anchor = 2;
  repeated ExportRecord after = 3;
}

// ForwardListChunksRequest asks a remote node to list chunks in one of its
// local vaults. Used by the coordinating node to show chunk details for
// remote vaults in the inspector.
message ForwardListChunksRequest {
  bytes vault_id = 1;
}

message ForwardListChunksResponse {
  repeated ChunkMeta chunks = 1;
}

// ForwardWaitVaultReadyRequest asks a remote node to block until the named
// vault is registered and ready to accept transferred records, or the RPC
// deadline / cancellation fires. Replaces the source-side ForwardListChunks
// poll used by DrainVault to synchronize with the target node's AddVault.
// See gastrolog-3sdnn.
message ForwardWaitVaultReadyRequest {
  bytes vault_id = 1;
}

message ForwardWaitVaultReadyResponse {}

// ForwardGetPipelineBacklogRequest asks a remote node for its local
// on-disk pipeline segment counts for one vault.
message ForwardGetPipelineBacklogRequest {
  bytes vault_id = 1;
}

message ForwardGetPipelineBacklogResponse {
  uint32 working_segments = 1;
  uint32 completed_staging_segments = 2;
  uint32 head_segments = 3;
  uint32 pre_head_segments = 4;
  uint64 working_bytes = 5;
  uint64 completed_staging_bytes = 6;
  uint64 head_bytes = 7;
  uint64 pre_head_bytes = 8;
}

// ForwardWatchChunksRequest opens a peer-to-peer server-streaming
// subscription to a remote node's ChunkBus. The coordinating node uses
// this to multiplex chunk events from every cluster node into a single
// WatchChunks stream served to the connected client — the alternative is
// having the client open one stream per node, which doesn't work for
// browser clients that can only reach the cluster through one address.
// See gastrolog-3pf9w.
message ForwardWatchChunksRequest {}

// ForwardWatchChunksResponse mirrors the public WatchChunksResponse wire
// shape but is sent over the internal cluster gRPC transport. The
// coordinating node copies each event into its own WatchChunksResponse
// envelope before sending to the user-facing client, setting node_id to
// the peer node's identity so the client can track per-node version.
message ForwardWatchChunksResponse {
  bytes vault_id = 1;
  bytes chunk_id = 2;
  ChunkChangeOp op = 3;
  ChunkMeta meta = 4;
  uint64 record_count = 5;
  uint64 version = 6;
}

// ForwardGetIndexesRequest asks a remote node to return index status for
// a specific chunk in one of its local vaults.
message ForwardGetIndexesRequest {
  bytes vault_id = 1;
  bytes chunk_id = 2;
}

message ForwardGetIndexesResponse {
  bool sealed = 1;
  repeated IndexInfo indexes = 2;
}

// ForwardValidateVaultRequest asks a remote node to validate a vault's
// chunk and index integrity.
message ForwardValidateVaultRequest {
  bytes vault_id = 1;
}

message ForwardValidateVaultResponse {
  bool valid = 1;
  repeated ChunkValidation chunks = 2;

  // The responding node's own cloud-index audit. Absent when the vault has no
  // cloud store on that node.
  CloudIndexAudit cloud_index_audit = 3;
}

// ForwardValidateIngesterRequest asks a remote node to validate a candidate
// ingester config against ITSELF: factory construction, plus a trial bind of
// the listen addresses for listener types. Both are per-node facts — a port
// free on one node can be held by an unrelated process on another — so the
// answer is only meaningful from a node that would run the ingester.
//
// Carries the candidate config rather than an ID because the common caller is
// a pre-save check, where nothing is stored yet.
message ForwardValidateIngesterRequest {
  string type = 1;
  map<string, string> params = 2;
  // Optional ID of the ingester being edited; lets the responding node skip
  // the trial bind for addresses it is already holding for that ingester.
  bytes id = 3;
}

message ForwardValidateIngesterResponse {
  bool success = 1;
  string message = 2;
}

// ForwardGetChunkRequest asks a remote node to return details for a specific
// chunk in one of its local vaults.
message ForwardGetChunkRequest {
  bytes vault_id = 1;
  bytes chunk_id = 2;
}

message ForwardGetChunkResponse {
  ChunkMeta chunk = 1;
}

// ForwardAnalyzeChunkRequest asks a remote node to run index analysis on a
// vault (or specific chunk) and return the results.
message ForwardAnalyzeChunkRequest {
  bytes vault_id = 1;
  bytes chunk_id = 2; // empty = analyze all chunks
}

message ForwardAnalyzeChunkResponse {
  repeated ChunkAnalysis analyses = 1;
}

// ForwardSealVaultRequest asks a remote node to seal the active chunk of a vault.
message ForwardSealVaultRequest {
  bytes vault_id = 1;
}

message ForwardSealVaultResponse {}

// ForwardReindexVaultRequest asks a remote node to rebuild all indexes for a vault.
message ForwardReindexVaultRequest {
  bytes vault_id = 1;
}

message ForwardReindexVaultResponse {
  bytes job_id = 1;
}

// ForwardExportToVaultRequest asks a remote node to run an export-to-vault job.
// The remote node owns the target vault and runs the export locally.
message ForwardExportToVaultRequest {
  string expression = 1;   // Query expression (export op stripped)
  bytes target_vault_id = 2;  // Target vault UUID (already resolved)
}

message ForwardExportToVaultResponse {
  bytes job_id = 1;
}

// NotifyEvictionRequest is sent by the leader to a node that has been removed
// from the cluster. The evicted node should initiate a graceful shutdown.
message NotifyEvictionRequest {
  string reason = 1;
}

message NotifyEvictionResponse {}

// ForwardRemoveNodeRequest is sent by a follower to the leader to remove
// a node from the cluster. The leader executes the Raft membership change
// and sends the eviction notification.
message ForwardRemoveNodeRequest {
  bytes node_id = 1;
  // force bypasses the leader-side removal gates (see RemoveNodeRequest.force).
  bool force = 2;
  // self_removal marks the preStop `gastrolog cluster demote-self` path,
  // where the node is asking for its own removal while it is already
  // terminating. The leader's RF-preservation gate is optimistic for
  // that path (allow; placement reconcile re-places) and pessimistic for
  // operator-driven removal (refuse). Carried across the follower →
  // leader hop so the policy survives forwarding. See gastrolog-3vyex.
  bool self_removal = 3;
}

message ForwardRemoveNodeResponse {}

// ForwardSetNodeSuffrageRequest is sent by a follower to the leader to
// promote or demote a node's voting status.
message ForwardSetNodeSuffrageRequest {
  bytes node_id = 1;
  string node_addr = 2;
  bool voter = 3;
}

message ForwardSetNodeSuffrageResponse {}

// ForwardExplainRequest asks a remote node to return the explain plan for
// one or more of its local vaults.
message ForwardExplainRequest {
  string query = 1;
  repeated bytes vault_ids = 2;  // batch all vaults for this node in one RPC
}

message ForwardExplainResponse {
  repeated ChunkPlan chunks = 1;  // reuses existing ChunkPlan from query.proto
  int32 total_chunks = 2;
}

// ForwardFollowRequest opens a server-streaming follow (tail -f) on a remote
// node's local vaults. The remote node runs eng.Follow() and streams new
// records as they arrive. The coordinator merges local and remote streams.
message ForwardFollowRequest {
  repeated bytes vault_ids = 1;
  string query = 2;
}

// ForwardFollowResponse carries a batch of new records from a remote follow.
message ForwardFollowResponse {
  repeated ExportRecord records = 1;
}

// ImportRecordMessage carries a single record for client-streaming import.
// vault_id is set on every message; the server validates consistency.
message ImportRecordMessage {
  bytes vault_id = 1;
  ExportRecord record = 2;
}

// ForwardImportRecordsResponse reports how many records the client-streaming
// ForwardImportRecords RPC committed into the destination vault's sealed-chunk
// store.
message ForwardImportRecordsResponse {
  int64 records_written = 1;
}

// --- Managed file distribution ---

// PullManagedFileRequest asks a peer to stream a managed file's contents.
message PullManagedFileRequest {
  bytes file_id = 1;
}

// PullManagedFileChunk carries a chunk of file data during streaming transfer.
// The first chunk includes the filename and expected SHA256 hash.
message PullManagedFileChunk {
  bytes data = 1;            // chunk of file content (up to 64KB)
  string name = 2;           // original filename (first chunk only)
  string sha256 = 3;         // expected hash (first chunk only)
}

// --- Segment distribution (Rubicon C) ---

// PullSegmentRequest asks a peer (segment origin or another holder) to stream a
// completed segment's raw bytes for collection into a home node's head/.
message PullSegmentRequest {
  bytes vault_id = 1;
  bytes segment_id = 2;
}

// PullSegmentChunk carries a chunk of completed-segment bytes during streaming
// transfer. Unlike PullManagedFileChunk it carries no filename/hash: the
// collector verifies against the vault-ctl registry checksum after promotion.
message PullSegmentChunk {
  bytes data = 1; // chunk of segment content (up to 64KB)
}

// PullChunkGLCBRequest asks a peer holding a sealed pipeline chunk's GLCB to
// stream its bytes. Replica catch-up for homes that missed the build window
// and whose source segments are already released — without this, a home that
// misses builds can never recover chunk bytes.
message PullChunkGLCBRequest {
  bytes vault_id = 1;
  bytes chunk_id = 2;
}

// PullChunkGLCBChunk carries a slice of GLCB bytes during streaming transfer.
// The puller verifies the assembled file's seal metadata and size against the
// vault-ctl manifest entry before renaming it into place.
message PullChunkGLCBChunk {
  bytes data = 1;
}

// ListPeerManagedFilesRequest asks a peer which managed files it has on disk.
message ListPeerManagedFilesRequest {}

// ListPeerManagedFilesResponse returns the file IDs present on a peer.
message ListPeerManagedFilesResponse {
  repeated bytes file_ids = 1;
}

// ForwardRPCFrame carries one frame of a generic ForwardRPC exchange. The
// underlying gRPC method is a stream, but the contract is strictly unary:
// exactly one request frame and exactly one response frame. Server-streaming
// forwards are not supported (large streamed responses use ForwardSearch).
//
// Client sends: one frame with procedure + payload (serialized request).
// Server sends: one frame — either payload (serialized response) or
//   error_code != 0 with error_message.
message ForwardRPCFrame {
  string procedure = 1;     // Connect procedure path, set in the client frame
  bytes payload = 2;        // proto-encoded request or response message
  uint32 error_code = 3;    // Connect error code (0 = success, response only)
  string error_message = 4; // error detail (response only)
}
