# GastroLog Docker Swarm stack.
#
# A 2-node example: one bootstrap service (replicas: 1) and one
# joiner service (replicas: 1). Each as a distinct service block
# rather than `replicas: N` on a single service, because Swarm's
# default node-local volumes mean all replicas of a single
# service that schedule on the same node would share /config
# and /vaults — fatal for Raft.
#
# To scale beyond 2 nodes:
#   - In a multi-node Swarm: each Swarm node gets its own copy of
#     the named volume by default. You can either (a) duplicate the
#     `joiner` service block (joiner-1, joiner-2, ...) and use
#     placement constraints to pin each to a different node, or
#     (b) keep a single replicated `joiner` service and add a
#     placement constraint with `node.labels.gastrolog == true`
#     plus `placement.preferences.spread: node.id`.
#   - On a single-node Swarm: duplicate the joiner service block
#     (joiner-1, joiner-2, ...) with separate volumes per service.
#
# Deploy:
#   echo '{"username": "admin", "password": "change-me"}' \
#     | docker secret create gastrolog_admin_creds -
#   docker stack deploy -c stack.yml gastrolog
#
# Tear down:
#   docker stack rm gastrolog
#   docker secret rm gastrolog_admin_creds   # if you don't want to reuse it

services:
  # Swarm service name stays `bootstrap` (operator-facing in `docker
  # service ls`); the gastrolog node name is `gastrolog-0` (UI-facing).
  bootstrap:
    image: gastrolog:test # change to ghcr.io/kluzzebass/gastrolog:latest for a release image
    hostname: gastrolog-0
    environment:
      GASTROLOG_NAME: gastrolog-0
      # `auto` makes the entrypoint resolve the container's hostname to
      # its overlay IP and use that as cluster-addr. Required for Swarm
      # and Kubernetes overlay networking, where service-name DNS
      # resolves to a routing-mesh VIP that no container can bind to,
      # and per-task DNS only registers after the first task is healthy
      # (chicken-and-egg with the listener startup).
      GASTROLOG_CLUSTER_ADDR: auto
      GASTROLOG_WRITE_BOOTSTRAP_TOKEN: /shared/token
      GASTROLOG_INITIAL_ADMIN_FILE: /run/secrets/admin_creds
    secrets:
      - source: gastrolog_admin_creds
        target: admin_creds
    volumes:
      - cluster-token:/shared
      - bootstrap-config:/config
      - bootstrap-vaults:/vaults
    ports:
      - target: 4564
        published: 4564
        mode: ingress
    networks:
      - gastrolog
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
      update_config:
        order: start-first
        failure_action: rollback

  # Swarm service name stays `joiner-1`; gastrolog node name is `gastrolog-1`.
  joiner-1:
    image: gastrolog:test
    hostname: gastrolog-1
    environment:
      GASTROLOG_NAME: gastrolog-1
      GASTROLOG_CLUSTER_ADDR: auto
      # tasks.<service> DNS resolves to the bootstrap's overlay IP from
      # any peer container. Only used at join time (after the bootstrap
      # is up and registered in the overlay's DNS), so the resolution
      # always succeeds.
      GASTROLOG_JOIN_ADDR: tasks.gastrolog_bootstrap:4566
      GASTROLOG_BOOTSTRAP_TOKEN_FILE: /shared/token
      GASTROLOG_INITIAL_ADMIN_FILE: /run/secrets/admin_creds
    secrets:
      - source: gastrolog_admin_creds
        target: admin_creds
    volumes:
      - cluster-token:/shared
      - joiner-1-config:/config
      - joiner-1-vaults:/vaults
    networks:
      - gastrolog
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

  # ── Cloud storage ────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    command: [ "server", "/data", "--console-address=:9001" ]
    environment:
      MINIO_ROOT_USER: gastrolog
      MINIO_ROOT_PASSWORD: gastrolog
    volumes:
      - minio-data:/data
    networks:
      - gastrolog
    deploy:
      placement: { constraints: [ node.role == manager ] }

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    command:
      - azurite
      - --blobHost=0.0.0.0
      - --queueHost=0.0.0.0
      - --tableHost=0.0.0.0
      - --skipApiVersionCheck
    volumes:
      - azurite-data:/data
    networks:
      - gastrolog
    deploy:
      placement: { constraints: [ node.role == manager ] }

  fake-gcs:
    image: fsouza/fake-gcs-server:latest
    command:
      - -scheme=http
      - -port=4443
      - -backend=filesystem
      - -filesystem-root=/data
      - -external-url=http://localhost:4443
    volumes:
      - fake-gcs-data:/data
    networks:
      - gastrolog
    deploy:
      placement: { constraints: [ node.role == manager ] }

  # ── Kafka (KRaft, single-node) ──────────────────────────────────
  # Same trick as in k8s-deps.yml: controller talks to itself via
  # localhost so we don't have to expose port 9093 on a Service.
  kafka:
    image: apache/kafka:latest
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://localhost:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - gastrolog
    deploy:
      placement: { constraints: [ node.role == manager ] }

  kafka-init:
    image: apache/kafka:latest
    entrypoint:
      - /bin/sh
      - -c
      - |
        for i in $$(seq 1 60); do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null 2>&1 && break
          sleep 2
        done
        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:9092 \
          --create --if-not-exists \
          --topic gastrolog-logs \
          --partitions 1 --replication-factor 1
    networks:
      - gastrolog
    deploy:
      restart_policy: { condition: none }
      placement: { constraints: [ node.role == manager ] }

  kafka-producer:
    image: apache/kafka:latest
    entrypoint:
      - /bin/sh
      - -c
      - |
        for i in $$(seq 1 60); do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --describe --topic gastrolog-logs >/dev/null 2>&1 && break
          sleep 2
        done
        i=0
        while true; do
          i=$$((i + 1))
          echo "{\"message\": \"kafka integration test log line\", \"seq\": $$i}" | \
            /opt/kafka/bin/kafka-console-producer.sh \
              --bootstrap-server kafka:9092 \
              --topic gastrolog-logs
          sleep 2
        done
    networks:
      - gastrolog
    deploy:
      placement: { constraints: [ node.role == manager ] }

  # ── rsyslog ──────────────────────────────────────────────────────
  # Config rewrites host.docker.internal → tasks.gastrolog_bootstrap so
  # rsyslog targets the bootstrap pod's overlay IP. Configs are created
  # by the swarm-up recipe before deploy.
  # rsyslog is intentionally NOT in the Swarm stack:
  #
  # The `rsyslog/syslog_appliance_alpine` image is amd64-only.
  # K8s/OrbStack run it via QEMU emulation; Swarm refuses with
  # "unsupported platform on 1 node" and the `platform:` field
  # isn't honored at the service level in stack files (it's a
  # Compose-only directive). The clean fix would be a multi-arch
  # image; until then, rsyslog is omitted on Swarm.
  #
  # If you're on an amd64 Swarm host, uncomment the block below.
  #
  # rsyslog:
  #   image: rsyslog/syslog_appliance_alpine:latest
  #   configs:
  #     - source: gastrolog_rsyslog_conf
  #       target: /etc/rsyslog.conf
  #       mode: 0o444
  #   networks:
  #     - gastrolog
  #   deploy:
  #     placement: { constraints: [node.role == manager] }

  # ── OTel Collector ───────────────────────────────────────────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    user: "0"
    configs:
      - source: gastrolog_otel_conf
        target: /etc/otelcol-contrib/config.yaml
        mode: 0o444
    volumes:
      - otel-logs:/var/log/otel
    networks:
      - gastrolog
    deploy:
      placement: { constraints: [ node.role == manager ] }

  # ── Fluent Bit ───────────────────────────────────────────────────
  fluent-bit:
    image: fluent/fluent-bit:latest
    configs:
      - source: gastrolog_fluent_bit_conf
        target: /fluent-bit/etc/fluent-bit.conf
        mode: 0o444
    networks:
      - gastrolog
    deploy:
      placement: { constraints: [ node.role == manager ] }

volumes:
  cluster-token:
  bootstrap-config:
  bootstrap-vaults:
  joiner-1-config:
  joiner-1-vaults:
  minio-data:
  azurite-data:
  fake-gcs-data:
  otel-logs:

networks:
  gastrolog:
    driver: overlay
    attachable: true

secrets:
  gastrolog_admin_creds:
    external: true

configs:
  gastrolog_rsyslog_conf:
    external: true
  gastrolog_otel_conf:
    external: true
  gastrolog_fluent_bit_conf:
    external: true
