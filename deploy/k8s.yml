# GastroLog Kubernetes manifests: single StatefulSet, headless Service
# for stable per-pod DNS, ConfigMap for non-secret config, Secret for
# admin credentials and bootstrap-token shared secret.
#
# Apply:
#   kubectl apply -f k8s.yml
#   open http://localhost:30564 (NodePort) or use port-forward
#
# Naming: cluster nodes are `gastrolog-0` (bootstrap), `gastrolog-1`,
# `gastrolog-2`, ... — pod name = hostname = GASTROLOG_NAME, so what
# you see in `kubectl get pods` matches what's in the gastrolog UI.
#
# Role detection: pod 0 is always the bootstrap; pods 1..N-1 are
# joiners. The container's `command:` wrapper branches on
# `${HOSTNAME##*-}` to set bootstrap-vs-joiner env vars at startup —
# this is the only way to get per-ordinal env in a StatefulSet
# (Kubernetes env substitution doesn't have conditionals).
#
# Token delivery uses the HTTP endpoint path (gastrolog-o9z6o):
# pod 0 serves /cluster/bootstrap-token gated on a shared secret;
# joiners poll the URL with backoff. Same secret value flows to every
# pod via the gastrolog-secrets Secret; the wrapper picks which
# direction (serve vs consume) based on ordinal.

---
apiVersion: v1
kind: Namespace
metadata:
  name: gastrolog

---
# Headless Service — gives each pod a stable DNS name
# (e.g. gastrolog-0.gastrolog-headless.gastrolog.svc.cluster.local).
# clusterIP: None disables the routing-mesh VIP, so DNS returns the
# pod's actual IP — required for Raft peer-to-peer communication.
apiVersion: v1
kind: Service
metadata:
  name: gastrolog-headless
  namespace: gastrolog
spec:
  clusterIP: None
  # Publish DNS records for pods even before they pass the readiness probe.
  # Pods depend on each other's DNS being resolvable during startup — Raft
  # quorum can't form until peer addresses resolve, but readiness depends
  # on Raft being functional. Without this flag, headless DNS only returns
  # Ready pods, creating a chicken-and-egg deadlock on cluster bootstrap
  # and on rolling restarts. See gastrolog-4zy8a.
  publishNotReadyAddresses: true
  selector:
    app: gastrolog
  ports:
    - name: http
      port: 4564
    - name: cluster
      port: 4566

---
# Regular Service for external access to the HTTP API.
apiVersion: v1
kind: Service
metadata:
  name: gastrolog
  namespace: gastrolog
spec:
  type: NodePort
  selector:
    app: gastrolog
  ports:
    - name: http
      port: 4564
      targetPort: 4564
      nodePort: 30564

---
# Non-secret config shared by all pods.
apiVersion: v1
kind: ConfigMap
metadata:
  name: gastrolog-config
  namespace: gastrolog
data:
  GASTROLOG_LISTEN: ":4564"
  GASTROLOG_CLUSTER_ADDR: "auto"
  # Environment banner (gastrolog-4vr0l). Displayed in the UI header so
  # operators can tell at a glance which deployment they're connected to.
  # Single token only (no spaces). Color accepts any CSS color value.
  GASTROLOG_ENVIRONMENT_LABEL: "Kubernetes"
  GASTROLOG_ENVIRONMENT_COLOR: "red"
  # gastrolog-6bfwk: stale-voter reaper threshold + interval — both
  # overrideable for test scenarios (env vars are read at process
  # startup). Leave unset in the deployed manifest to inherit the
  # safe defaults (10m / 60s). The 2m threshold we tried during
  # initial verification was BELOW the rolling-redeploy window and
  # caused the reaper to evict voters mid-rollout; the rule of thumb
  # is threshold >= 5 × (pod_count × per_pod_restart_window).

---
# Secret for admin credentials + the bootstrap-token shared secret.
# In production: replace the values below with sealed-secrets, an
# external secret operator, or apply via `kubectl create secret`
# from a file that's never checked in.
apiVersion: v1
kind: Secret
metadata:
  name: gastrolog-secrets
  namespace: gastrolog
type: Opaque
stringData:
  admin_creds: |
    {"username": "admin", "password": "change-me"}
  bootstrap_token_secret: "rotate-this-secret-please"

---
# Single StatefulSet. Default replicas: 3 (bootstrap + 2 joiners).
# Scale via `just deploy kubernetes-expand N` / `kubernetes-scale N`.
# Floor of 3 — anything less drops below quorum tolerance.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: gastrolog
  namespace: gastrolog
spec:
  serviceName: gastrolog-headless
  replicas: 3
  # Parallel pod management — new pods are created regardless of whether
  # older pods are Ready. Default OrderedReady deadlocks scale-up if any
  # existing pod is unhealthy: K8s sits waiting for pod-N to report Ready
  # before creating pod-N+1. Per-vault Raft groups are symmetric, no
  # cross-pod startup ordering is needed beyond the bootstrap-token
  # handshake (HTTP-gated on pod-0's /readyz, which the joiner polls
  # itself).
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: gastrolog
  template:
    metadata:
      labels:
        app: gastrolog
    spec:
      containers:
        - name: gastrolog
          image: gastrolog:test       # change to ghcr.io/kluzzebass/gastrolog:latest for a release image
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4564
              name: http
            - containerPort: 4566
              name: cluster
          envFrom:
            - configMapRef:
                name: gastrolog-config
          env:
            - name: GASTROLOG_INITIAL_ADMIN_FILE
              value: /etc/gastrolog/admin_creds
            # Token-delivery secret. Wrapper exports it as either
            # GASTROLOG_BOOTSTRAP_TOKEN_SERVE_SECRET (pod 0) or
            # GASTROLOG_BOOTSTRAP_TOKEN_SECRET (pods 1..N-1).
            - name: BOOTSTRAP_TOKEN_SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  name: gastrolog-secrets
                  key: bootstrap_token_secret
          # Per-ordinal role detection. Pod 0 is the bootstrap; pods
          # 1..N-1 are joiners. Pod hostname is `gastrolog-N` (matches
          # the StatefulSet's pod naming), so $HOSTNAME = the gastrolog
          # node name directly.
          command:
            - /bin/sh
            - -c
            - |
              export GASTROLOG_NAME=$HOSTNAME
              # Advertise via the per-pod headless-service DNS name so peers
              # store a stable identifier and reconnect through DNS after
              # the pod IP rotates on restart. Without this, the cluster
              # Raft pins the original pod IP and a rolled pod is
              # unreachable forever. See gastrolog-4zy8a.
              export GASTROLOG_CLUSTER_ADVERTISE=$HOSTNAME.gastrolog-headless.gastrolog.svc.cluster.local:4566
              ord=${HOSTNAME##*-}
              if [ "$ord" = "0" ]; then
                export GASTROLOG_BOOTSTRAP_TOKEN_SERVE_SECRET=$BOOTSTRAP_TOKEN_SHARED_SECRET
              else
                export GASTROLOG_JOIN_ADDR=gastrolog-0.gastrolog-headless.gastrolog.svc.cluster.local:4566
                export GASTROLOG_BOOTSTRAP_TOKEN_URL=http://gastrolog-0.gastrolog-headless.gastrolog.svc.cluster.local:4564/cluster/bootstrap-token
                export GASTROLOG_BOOTSTRAP_TOKEN_SECRET=$BOOTSTRAP_TOKEN_SHARED_SECRET
              fi
              exec /docker-entrypoint.sh server
          volumeMounts:
            - name: config
              mountPath: /config
            - name: vaults
              mountPath: /vaults
            - name: secrets
              mountPath: /etc/gastrolog
              readOnly: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: 4564
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 4564
            initialDelaySeconds: 5
            periodSeconds: 5
          # preStop hook: tell the cluster to remove this node from the
          # Raft voter set before SIGTERM. Fires for every K8s-managed
          # termination (scale-down, rolling restart, voluntary
          # eviction, drain) — but NOT on crash, OOM, or hardware
          # failure, which is exactly the policy we want: graceful
          # exits cleanly remove themselves; abrupt exits remain in the
          # voter set until either the operator removes them or the
          # node returns (and goes through the boot-time auto-rejoin
          # path if it had been evicted in the interim).
          #
          # Without this, scale-down via `kubectl scale` would strand
          # ghost voters in Raft forever, eventually relying on the
          # stale-voter-reaper — which was the original gastrolog-6bfwk
          # workaround. See gastrolog-24iv4 for the design rationale
          # and gastrolog-6bfwk for the failure mode this fixes.
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - /gastrolog --home /config cluster demote-self || true
      # terminationGracePeriodSeconds bounds the total preStop +
      # SIGTERM-handling window. 30s is generous: demote-self normally
      # completes within a few hundred ms, and the shutdown drain
      # itself is bounded by the orchestrator's own internal timeouts.
      terminationGracePeriodSeconds: 30
      volumes:
        - name: secrets
          secret:
            secretName: gastrolog-secrets
            defaultMode: 0o400
            items:
              - key: admin_creds
                path: admin_creds
  volumeClaimTemplates:
    - metadata:
        name: config
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
    - metadata:
        name: vaults
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
